<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>g.</title></head>
<body>
<script>
if (/^\/(?:g\/|@)[^?#]*/.test(location.pathname)) {
  sessionStorage.setItem('g_return_path', location.pathname + location.search + location.hash);
  location.replace('/g');
} else {
  document.body.textContent = 'Halaman tidak ditemui.';
}
</script>
</body>
</html>
