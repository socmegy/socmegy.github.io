<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Socmegy Admin</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== HIDE ALL SCROLLBARS ===== */
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        body { overflow-y: scroll; }

        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        /* ===== SPLASH SCREEN ===== */
        #splashScreen {
            position: fixed;
            inset: 0;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s ease;
        }
        #splashScreen.hide { opacity: 0; pointer-events: none; }
        #splashScreen img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            animation: splashPulse 1.2s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        /* ===== LOGIN PAGE ===== */
        #loginPage {
            display: none;
            min-height: 100vh;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            position: fixed;
            inset: 0;
            z-index: 9998;
        }
        #loginPage.active {
            display: flex !important;
        }
        .login-wrap {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        .login-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .login-left .app-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.3);
        }
        .login-left h1 {
            font-size: 44px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 12px;
            letter-spacing: -1px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .login-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 56px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .login-right h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 4px;
        }
        .login-right .sub {
            color: #6e6e73;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-right .form-group {
            margin-bottom: 14px;
        }
        .login-right .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #b8860b;
            margin-bottom: 4px;
        }
        .login-right .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 12px;
            font-size: 15px;
            background: #f8f8fa;
            transition: border 0.2s;
        }
        .login-right .form-group input:focus {
            outline: none;
            border-color: #b8860b;
        }
        .login-right .form-group input::placeholder {
            color: #aaa;
        }
        .login-right .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .login-right .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #b8860b;
            cursor: pointer;
        }
        .login-right .remember-row label {
            font-size: 13px;
            color: #6e6e73;
            cursor: pointer;
        }
        .login-right .login-btn {
            width: 100%;
            padding: 14px;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .login-right .login-btn:hover { opacity: 0.85; }
        .login-right .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-error {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* ===== LOGIN MOBILE - FIXED ===== */
        @media (max-width: 768px) {
            #loginPage { 
                background-image: url('bg.jpg') !important;
                background-size: cover !important;
                background-position: center !important;
                position: fixed;
                inset: 0;
                z-index: 9998;
                min-height: 100vh;
            }
            #loginPage.active {
                display: flex !important;
            }
            .login-wrap {
                flex-direction: column;
                justify-content: flex-end;
                min-height: 100vh;
                width: 100%;
            }
            .login-left {
                padding: 20px 16px 10px;
                flex: none;
                background: none;
                min-height: auto;
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .login-left .app-logo {
                width: 72px;
                height: 72px;
                border: 3px solid rgba(255,255,255,0.25);
                margin-bottom: 4px;
            }
            .login-left h1 {
                font-size: 26px;
                color: #ffffff;
                text-shadow: 0 2px 16px rgba(0,0,0,0.35);
                margin-top: 2px;
                margin-bottom: 12px;
                letter-spacing: -0.5px;
            }
            .login-right {
                padding: 18px 18px 24px;
                flex: none;
                background: rgba(255,255,255,0.92);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border-radius: 20px 20px 0 0;
                width: 100%;
                margin: 0;
                box-shadow: 0 -4px 30px rgba(0,0,0,0.06);
            }
            .login-right .handle {
                width: 40px;
                height: 4px;
                background: rgba(0,0,0,0.12);
                border-radius: 4px;
                margin: 0 auto 12px;
            }
            .login-right h2 {
                font-size: 20px;
                text-align: center;
                color: #1d1d1f;
            }
            .login-right .sub { 
                text-align: center; 
                color: #6e6e73;
                margin-bottom: 16px;
            }
            .login-right .form-group {
                margin-bottom: 10px;
            }
            .login-right .form-group input {
                padding: 12px 14px;
                font-size: 14px;
            }
            .login-right .login-btn {
                padding: 12px;
                font-size: 15px;
            }
            .login-right .remember-row { 
                justify-content: center;
                margin-bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            #loginPage {
                background-image: url('bg.jpg') !important;
                background-size: cover !important;
                background-position: center !important;
            }
            .login-left {
                padding: 16px 14px 6px;
            }
            .login-left .app-logo {
                width: 60px;
                height: 60px;
            }
            .login-left h1 {
                font-size: 22px;
                margin-bottom: 8px;
            }
            .login-right {
                padding: 14px 14px 20px;
                border-radius: 16px 16px 0 0;
            }
            .login-right h2 {
                font-size: 18px;
            }
            .login-right .form-group input {
                padding: 10px 12px;
                font-size: 13px;
            }
            .login-right .login-btn {
                padding: 10px;
                font-size: 14px;
            }
        }

        /* ===== ADMIN APP ===== */
        #adminApp { 
            display: none; 
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== TOP HEADER ===== */
        .admin-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            padding: 0 28px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-topbar .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .admin-topbar .brand span {
            font-size: 18px;
            font-weight: 700;
            color: #b8860b;
        }
        .admin-topbar .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-topbar .topbar-right .user-badge {
            font-size: 13px;
            color: #6e6e73;
        }
        .admin-topbar .topbar-right .logout-btn {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: opacity 0.2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .admin-topbar .topbar-right .logout-btn:hover { opacity: 0.85; }

        /* ===== SIDEBAR ===== */
        .admin-sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(0,0,0,0.04);
            padding: 12px 10px;
            overflow-y: auto;
            z-index: 90;
            transition: transform 0.3s ease;
        }
        .admin-sidebar .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #6e6e73;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            margin-bottom: 1px;
        }
        .admin-sidebar .nav-item:hover {
            background: rgba(0,0,0,0.04);
            color: #1d1d1f;
        }
        .admin-sidebar .nav-item.active {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .admin-sidebar .nav-item .badge {
            font-size: 11px;
            font-weight: 600;
            background: rgba(0,0,0,0.06);
            padding: 0 10px;
            border-radius: 30px;
            color: #6e6e73;
            text-align: center;
            min-width: 24px;
        }
        .admin-sidebar .nav-item.active .badge {
            background: rgba(255,255,255,0.2);
            color: #ffffff;
        }
        .admin-sidebar .sidebar-divider {
            height: 1px;
            background: rgba(0,0,0,0.04);
            margin: 6px 12px;
        }
        .admin-sidebar .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 14px 2px;
        }

        /* ===== MAIN CONTENT ===== */
        .admin-main {
            margin-left: 220px;
            margin-top: 60px;
            padding: 24px 28px 48px;
            min-height: calc(100vh - 60px);
        }

        /* ===== CARDS ===== */
        .admin-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.04);
            padding: 18px 22px;
            margin-bottom: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .admin-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .admin-card .card-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #1d1d1f;
        }
        .admin-card .card-header .card-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .admin-card .card-header .count-badge {
            font-size: 12px;
            color: #8e8e93;
            background: rgba(0,0,0,0.04);
            padding: 2px 12px;
            border-radius: 30px;
        }

        /* ===== STATS ROW ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .stats-row .stat-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid rgba(0,0,0,0.04);
            text-align: center;
        }
        .stats-row .stat-card .num {
            font-size: 28px;
            font-weight: 700;
            color: #b8860b;
        }
        .stats-row .stat-card .label {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .quick-actions .btn { width: 100%; justify-content: center; padding: 12px; }

        /* ===== LIST ITEM ===== */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            gap: 10px;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .item-main { flex: 1; min-width: 0; }
        .list-item .item-main .title {
            font-weight: 600;
            font-size: 14px;
            color: #1d1d1f;
        }
        .list-item .item-main .sub {
            font-size: 12px;
            color: #6e6e73;
            margin-top: 1px;
        }
        .list-item .item-main .meta {
            font-size: 11px;
            color: #8e8e93;
            margin-top: 2px;
        }
        .list-item .item-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .list-item .item-actions button {
            background: rgba(0,0,0,0.04);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #6e6e73;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .list-item .item-actions button:hover { background: rgba(0,0,0,0.08); }
        
        /* ===== EDIT & DELETE BUTTONS - SAME FOR ALL TABS ===== */
        .list-item .item-actions .edit-btn {
            background: rgba(184, 134, 11, 0.12);
            color: #b8860b;
        }
        .list-item .item-actions .edit-btn:hover {
            background: rgba(184, 134, 11, 0.25);
            color: #b8860b;
        }
        .list-item .item-actions .delete-btn {
            background: rgba(231, 76, 60, 0.12);
            color: #e74c3c;
        }
        .list-item .item-actions .delete-btn:hover {
            background: rgba(231, 76, 60, 0.25);
            color: #c0392b;
        }
        .list-item .item-actions .view-receipt-btn {
            background: rgba(52, 152, 219, 0.12);
            color: #3498db;
        }
        .list-item .item-actions .view-receipt-btn:hover {
            background: rgba(52, 152, 219, 0.25);
        }
        .list-item .item-actions .whatsapp-btn {
            background: rgba(37, 211, 102, 0.12);
            color: #25d366;
        }
        .list-item .item-actions .whatsapp-btn:hover {
            background: rgba(37, 211, 102, 0.25);
        }

        /* ===== RESULT ITEM - with preview ===== */
        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .result-preview {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
            background: #f5f5f7;
        }
        .result-item .result-info {
            flex: 1;
            min-width: 0;
        }
        .result-item .result-info .title {
            font-weight: 600;
            font-size: 14px;
            color: #1d1d1f;
        }
        .result-item .result-info .sub {
            font-size: 12px;
            color: #6e6e73;
        }
        .result-item .result-info .meta {
            font-size: 11px;
            color: #8e8e93;
        }
        .result-item .result-info .meta a {
            color: #b8860b;
            text-decoration: none;
        }
        .result-item .result-info .meta a:hover { text-decoration: underline; }
        .result-item .item-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .result-item .item-actions button {
            background: rgba(0,0,0,0.04);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #6e6e73;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .result-item .item-actions button:hover { background: rgba(0,0,0,0.08); }
        .result-item .item-actions .edit-btn {
            background: rgba(184, 134, 11, 0.12);
            color: #b8860b;
        }
        .result-item .item-actions .edit-btn:hover {
            background: rgba(184, 134, 11, 0.25);
            color: #b8860b;
        }
        .result-item .item-actions .delete-btn {
            background: rgba(231, 76, 60, 0.12);
            color: #e74c3c;
        }
        .result-item .item-actions .delete-btn:hover {
            background: rgba(231, 76, 60, 0.25);
            color: #c0392b;
        }

        /* ===== NEW STAMP ===== */
        .new-stamp {
            display: inline-block;
            color: #b8860b;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            border: 2px solid #b8860b;
            padding: 0 6px;
            border-radius: 2px;
            line-height: 1.3;
            background: rgba(184, 134, 11, 0.08);
            margin-right: 3px;
            transform: rotate(-3deg);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .new-stamp::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent 0%, rgba(184,134,11,0.15) 30%, rgba(184,134,11,0.3) 50%, rgba(184,134,11,0.15) 70%, transparent 100%);
            animation: stampShimmer 4s infinite ease-in-out;
            transform: skewX(-25deg);
        }
        @keyframes stampShimmer {
            0% { transform: translateX(-100%) skewX(-25deg); }
            100% { transform: translateX(100%) skewX(-25deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 36px 16px;
            color: #8e8e93;
        }
        .empty-state .empty-icon { font-size: 32px; opacity: 0.2; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .btn-primary {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
        }
        .btn-primary:hover { opacity: 0.85; }
        .btn-danger {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
        }
        .btn-danger:hover { opacity: 0.85; }
        .btn-secondary {
            background: rgba(0,0,0,0.04);
            color: #1d1d1f;
            text-shadow: none;
        }
        .btn-secondary:hover { background: rgba(0,0,0,0.08); }
        .btn-success {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff;
        }
        .btn-success:hover { opacity: 0.85; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }

        /* ===== SETTINGS ROW ===== */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            gap: 10px;
            flex-wrap: wrap;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-row .label {
            font-weight: 500;
            font-size: 14px;
            color: #1d1d1f;
        }
        .settings-row input {
            width: 100px;
            padding: 8px 12px;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            background: #f8f8fa;
        }
        .settings-row input:focus { outline: none; border-color: #b8860b; }
        .settings-row .desc {
            font-size: 12px;
            color: #8e8e93;
            flex: 1;
            min-width: 100px;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            display: flex;

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDNgnDAitHmMHQN2WwEd_wvJ7WKy8qAGd0",
        authDomain: "socmegy.firebaseapp.com",
        databaseURL: "https://socmegy-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "socmegy",
        storageBucket: "socmegy.firebasestorage.app",
        messagingSenderId: "743231746220",
        appId: "1:743231746220:web:007ef2bacb2cc80caf6f09",
        measurementId: "G-0WL8D4908E"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ============================================================
    // STATE
    // ============================================================
    let categories = [];
    let services = [];
    let reviews = [];
    let results = [];
    let orders = [];
    let announcements = [];
    let popups = [];
    let readContent = '';
    let settings = { discountPercent: 10, minPurchase: 10 };
    let currentTab = 'dashboard';
    let editingType = null;
    let editingId = null;
    let currentReceiptOrder = null;
    let orderIdCounter = 0;

    // ============================================================
    // SPLASH SCREEN
    // ============================================================
    function hideSplash() {
        const splash = document.getElementById('splashScreen');
        splash.classList.add('hide');
        setTimeout(() => { splash.style.display = 'none'; }, 600);
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function getCategoryName(id) {
        const cat = categories.find(c => c.id === id);
        return cat ? cat.name : id;
    }

    function formatPrice(val) {
        if (isNaN(val) || val === undefined || val === null) return 'RM0.00';
        return 'RM' + Number(val).toFixed(2);
    }

    function getMalaysiaTime() {
        const now = new Date();
        return now.toLocaleString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' });
    }

    function isNew(dateStr) {
        if (!dateStr) return false;
        const today = new Date();
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(today.getDate() - 7);
        const d = new Date(dateStr);
        return d >= sevenDaysAgo && d <= today;
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // ============================================================
    // AUTH
    // ============================================================
    function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const btn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');

        if (!email || !password) {
            errorEl.textContent = 'Please enter email and password';
            errorEl.style.display = 'block';
            return;
        }

        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('adminEmail', email);
            localStorage.setItem('adminPass', password);
        } else {
            localStorage.removeItem('adminEmail');
            localStorage.removeItem('adminPass');
        }

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        errorEl.style.display = 'none';

        auth.signInWithEmailAndPassword(email, password)
            .then(userCredential => {
                // HIDE LOGIN
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminApp').style.display = 'block';
                document.getElementById('userEmail').textContent = userCredential.user.email;
                btn.disabled = false;
                btn.textContent = 'Sign In';
                hideSplash();
                initApp();
            })
            .catch(error => {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            });
    }

    function handleLogout() {
        if (confirm('Logout?')) {
            auth.signOut().then(() => {
                document.getElementById('adminApp').style.display = 'none';
                document.getElementById('loginPage').style.display = 'flex';
                document.getElementById('loginPage').classList.add('active');
                document.getElementById('loginPassword').value = '';
                document.getElementById('splashScreen').style.display = 'flex';
                document.getElementById('splashScreen').classList.remove('hide');
            });
        }
    }

    // Check auth state
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminApp').style.display = 'block';
            document.getElementById('userEmail').textContent = user.email;
            hideSplash();
            initApp();
        } else {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('loginPage').classList.add('active');
            document.getElementById('adminApp').style.display = 'none';
            hideSplash();
        }
    });

    // Check remember me
    const savedEmail = localStorage.getItem('adminEmail');
    const savedPass = localStorage.getItem('adminPass');
    if (savedEmail) {
        document.getElementById('loginEmail').value = savedEmail;
        document.getElementById('loginPassword').value = savedPass || '';
        document.getElementById('rememberMe').checked = true;
    }

    // ============================================================
    // TOAST
    // ============================================================
    let toastTimeout;

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function hideToast() {
        document.getElementById('toast').classList.remove('show');
    }

    document.getElementById('toastCloseBtn').addEventListener('click', hideToast);

    // ============================================================
    // MODAL
    // ============================================================
    function openModal(title, bodyHtml, submitText) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = bodyHtml;
        const submitBtn = document.getElementById('modalSubmitBtn');
        submitBtn.textContent = submitText || 'Save';
        submitBtn.dataset.originalText = submitText || 'Save';
        submitBtn.disabled = false;
        submitBtn.style.cursor = 'pointer';
        submitBtn.style.opacity = '1';
        submitBtn.style.pointerEvents = 'auto';
        document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('open');
        editingId = null;
        editingType = null;
        const btn = document.getElementById('modalSubmitBtn');
        btn.disabled = false;
        btn.style.cursor = 'pointer';
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
    }

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

    // ============================================================

    // ============================================================
    document.getElementById('hamburgerBtn').addEventListener('click', function() {

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-item').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === tab);
        });
        document.getElementById('adminSidebar').classList.remove('open');

    // ============================================================
    // RENDER CONTENT
    // ============================================================
    function renderContent() {
        const container = document.getElementById('adminContent');
        if (currentTab === 'dashboard') renderDashboard(container);
        else if (currentTab === 'services') renderServices(container);
        else if (currentTab === 'categories') renderCategories(container);
        else if (currentTab === 'reviews') renderReviews(container);
        else if (currentTab === 'results') renderResults(container);
        else if (currentTab === 'orders') renderOrders(container);
        else if (currentTab === 'announcements') renderAnnouncements(container);
        else if (currentTab === 'popups') renderPopups(container);
        else if (currentTab === 'customization') renderCustomization(container);
        else if (currentTab === 'read') renderRead(container);
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    function renderDashboard(container) {
        const totalServices = services.length;
        const totalCategories = categories.length;
        const totalReviews = reviews.length;
        const totalResults = results.length;
        const totalOrders = orders.length;
        const pendingOrders = orders.filter(o => o.status === 'pending').length;

        let revenue = 0;
        orders.filter(o => o.status === 'completed').forEach(o => {
            revenue += o.total || 0;
        });

        const serviceUsage = {};
        orders.forEach(o => {
            if (o.services) {
                o.services.forEach(s => {
                    const key = s.name;
                    serviceUsage[key] = (serviceUsage[key] || 0) + s.qty;
                });
            }
        });
        const sortedServices = Object.entries(serviceUsage)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 5);

        let topServicesHtml = '';
        if (sortedServices.length === 0) {
            topServicesHtml = '<div style="text-align:center;padding:16px;color:#8e8e93;font-size:13px;">No service data yet</div>';
        } else {
            topServicesHtml = sortedServices.map(([name, count]) => `
                <div class="list-item">
                    <div class="item-main">
                        <div class="title">${name}</div>
                        <div class="meta">${count} orders</div>
                    </div>
                </div>
            `).join('');
        }

        container.innerHTML = `
            <div class="stats-row">
                <div class="stat-card"><div class="num">${totalServices}</div><div class="label">Total Services</div></div>
                <div class="stat-card"><div class="num">${totalCategories}</div><div class="label">Categories</div></div>
                <div class="stat-card"><div class="num">${totalOrders}</div><div class="label">Total Orders</div></div>
                <div class="stat-card"><div class="num">${formatPrice(revenue)}</div><div class="label">Revenue</div></div>
                <div class="stat-card"><div class="num">${pendingOrders}</div><div class="label">Pending Orders</div></div>
                <div class="stat-card"><div class="num">${totalReviews}</div><div class="label">Reviews</div></div>
            </div>

            <div class="admin-card">
                <div class="card-header"><h3>Top Services</h3></div>
                ${topServicesHtml}
            </div>

            <div class="admin-card">
                <div class="card-header"><h3>Quick Actions</h3></div>
                <div class="quick-actions">
                    <button class="btn btn-primary" onclick="switchTab('services')">Manage Services</button>
                    <button class="btn btn-primary" onclick="switchTab('orders')">View Orders</button>
                    <button class="btn btn-primary" onclick="switchTab('announcements')">Add Announcement</button>
                    <button class="btn btn-secondary" onclick="switchTab('popups')">Create Popup</button>
                </div>
            </div>
        `;
    }

    // ============================================================
    // ORDERS - FIXED ORDER ID
    // ============================================================
    function renderOrders(container) {
        document.getElementById('orderCount').textContent = orders.length;

        const statusColors = {
            pending: '#f39c12',
            paid: '#3498db',
            processing: '#9b59b6',
            completed: '#27ae60',
            cancelled: '#e74c3c'
        };
        const statusLabels = {
            pending: 'Pending',
            paid: 'Paid',
            processing: 'Processing',
            completed: 'Completed',
            cancelled: 'Cancelled'
        };

        let html = `
            <div class="admin-card">
                <div class="card-header">
                    <h3>Orders</h3>
                    <div class="card-actions">
                        <span class="count-badge">${orders.length} total</span>
                        <button class="btn btn-secondary" id="refreshOrders">Refresh</button>
                    </div>
                </div>
                <div class="search-bar">
                    <input type="text" id="orderSearch" placeholder="Search by Order ID or Phone Number..." />
                    <button class="btn btn-primary" id="searchOrdersBtn"><i class="fas fa-search"></i> Search</button>
                    <button class="btn btn-secondary" id="clearSearchBtn">Clear</button>
                </div>
                <div id="ordersList">
        `;

        const filteredOrders = orders.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filteredOrders.length === 0) {
            html += `
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <p>No orders found</p>
                    </div>
            `;
        } else {
            filteredOrders.forEach(order => {
                const orderId = order.orderId || order.id || 'N/A';
                html += `
                    <div class="list-item" data-order-id="${orderId}" data-phone="${order.customer?.phone || ''}">
                        <div class="item-main">
                            <div class="title">
                                <span style="color:#b8860b;">${orderId}</span>
                                <span style="font-size:12px;color:#8e8e93;font-weight:400;margin-left:8px;">
                                    ${order.date ? new Date(order.date).toLocaleDateString() : 'N/A'}
                                </span>
                            </div>
                            <div class="sub">
                                ${order.customer?.name || 'Unknown'}
                                ${order.customer?.phone ? '· ' + order.customer.phone : ''}
                            </div>
                            <div class="meta">
                                ${order.services?.length || 0} services ·
                                <span style="font-weight:600;color:#b8860b;">RM${(order.total || 0).toFixed(2)}</span>
                                ·
                                <span style="color:${statusColors[order.status] || '#666'};font-weight:600;">
                                    ${statusLabels[order.status] || order.status}
                                </span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="edit-btn" onclick="viewOrder('${orderId}')"><i class="fas fa-edit"></i></button>
                            <button class="view-receipt-btn" onclick="viewReceiptOrder('${orderId}')"><i class="fas fa-receipt"></i></button>
                            <button class="whatsapp-btn" onclick="whatsappOrder('${orderId}')"><i class="fab fa-whatsapp"></i></button>
                            <button class="delete-btn" onclick="deleteOrder('${orderId}')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        html += `
                </div>
            </div>
        `;
        container.innerHTML = html;

        document.getElementById('searchOrdersBtn')?.addEventListener('click', function() {
            const query = document.getElementById('orderSearch').value.toLowerCase().trim();
            const items = container.querySelectorAll('.list-item');
            let found = 0;
            items.forEach(item => {
                const id = item.dataset.orderId?.toLowerCase() || '';
                const phone = item.dataset.phone?.toLowerCase() || '';
                const match = id.includes(query) || phone.includes(query);
                item.style.display = match ? 'flex' : 'none';
                if (match) found++;
            });
            const existingMsg = container.querySelector('.search-no-results');
            if (found === 0 && query) {
                if (!existingMsg) {
                    const msg = document.createElement('div');
                    msg.className = 'empty-state search-no-results';
                    msg.innerHTML = '<p>No orders match your search</p>';
                    document.getElementById('ordersList').appendChild(msg);
                }
            } else if (existingMsg) {
                existingMsg.remove();
            }
        });

        document.getElementById('clearSearchBtn')?.addEventListener('click', function() {
            document.getElementById('orderSearch').value = '';
            const items = container.querySelectorAll('.list-item');
            items.forEach(item => item.style.display = 'flex');
            const msg = container.querySelector('.search-no-results');
            if (msg) msg.remove();
        });

        document.getElementById('refreshOrders')?.addEventListener('click', function() {
            renderOrders(container);
            showToast('Orders refreshed');
        });

        document.getElementById('orderSearch')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') document.getElementById('searchOrdersBtn')?.click();
        });
    }

    // ============================================================
    // ORDER FUNCTIONS
    // ============================================================
    function viewOrder(id) {
        if (!id) {
            showToast('Order ID is missing');
            return;
        }

        db.ref('orders/' + id).once('value').then(snap => {
            const order = snap.val();
            if (!order) return showToast('Order not found');

            const orderId = order.orderId || id || 'N/A';

            const statusOptions = ['pending', 'paid', 'processing', 'completed', 'cancelled'];
            const statusHtml = statusOptions.map(s =>
                `<option value="${s}" ${order.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`
            ).join('');

            const servicesHtml = order.services?.map(s =>
                `<li>${s.name} × ${s.qty} = RM${(s.price * s.qty).toFixed(2)}</li>`
            ).join('') || '<li>No services</li>';

            const body = `
                <div style="background:#f8f8fa;border-radius:12px;padding:12px;margin-bottom:12px;">
                    <p><strong>Order ID:</strong> ${orderId}</p>
                    <p><strong>Date:</strong> ${order.date ? new Date(order.date).toLocaleString() : 'N/A'}</p>
                </div>
                <div style="background:#f8f8fa;border-radius:12px;padding:12px;margin-bottom:12px;">
                    <p><strong>Customer:</strong> ${order.customer?.name || 'Unknown'}</p>
                    <p><strong>Phone:</strong> ${order.customer?.phone || 'N/A'}</p>
                    <p><strong>Link:</strong> ${order.link || 'N/A'}</p>
                </div>
                <div style="background:#f8f8fa;border-radius:12px;padding:12px;margin-bottom:12px;">
                    <p><strong>Services:</strong></p>
                    <ul style="padding-left:20px;color:#6e6e73;font-size:13px;">${servicesHtml}</ul>
                    <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid #eaeaee;margin-top:8px;">
                        <span><strong>Total:</strong></span>
                        <span style="font-weight:700;color:#b8860b;">RM${(order.total || 0).toFixed(2)}</span>
                    </div>
                </div>
                <div class="form-group"><label>Status</label>
                    <select id="orderStatus">${statusHtml}</select>
                </div>
                <div class="form-group"><label>Notes</label>
                    <textarea id="orderNotes" rows="2">${order.notes || ''}</textarea>
                </div>
            `;

            editingType = 'orders';
            editingId = id;
            openModal('Order Details', body, 'Update Order');

            document.getElementById('modalSubmitBtn').onclick = function() {
                const status = document.getElementById('orderStatus').value;
                const notes = document.getElementById('orderNotes').value;
                db.ref('orders/' + id).update({ status, notes })
                    .then(() => {
                        showToast('Order updated');
                        closeModal();
                        renderContent();
                    })
                    .catch(() => showToast('Error updating order'));
            };
        });
    }

    // ===== RECEIPT FUNCTIONS =====
    function viewReceiptOrder(id) {
        if (!id) {
            showToast('Order ID is missing');
            return;
        }

        db.ref('orders/' + id).once('value').then(snap => {

    // ============================================================
    // MODAL SUBMIT
    // ============================================================
    document.getElementById('modalForm').addEventListener('submit', function(e) {
        e.preventDefault();
        e.stopPropagation();

        const type = editingType;
        const submitBtn = document.getElementById('modalSubmitBtn');

        if (!type) {
            showToast('Unknown operation');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
        submitBtn.style.cursor = 'not-allowed';
        submitBtn.style.opacity = '0.6';

        let data = {};
        let isValid = true;

        try {
            if (type === 'services') {
                const label = document.getElementById('f_label');
                const category = document.getElementById('f_category');
                const price = document.getElementById('f_price');

                if (!label || !label.value.trim()) { showToast('Label is required'); isValid = false; }
                else if (!category || !category.value) { showToast('Category is required'); isValid = false; }
                else if (!price || parseFloat(price.value) <= 0) { showToast('Price must be > 0'); isValid = false; }

                if (isValid) {
                    data = {
                        label: label.value.trim(),
                        desc: document.getElementById('f_desc').value.trim() || '',
                        category: category.value,
                        price: parseFloat(price.value) || 0,
                        discount: parseInt(document.getElementById('f_discount').value) || 0,
                        unavailable: document.getElementById('f_status').value === 'unavailable',
                        addedDate: document.getElementById('f_date').value || new Date().toISOString().split('T')[0]
                    };
                }
            } else if (type === 'categories') {
                const name = document.getElementById('f_name');
                if (!name || !name.value.trim()) { showToast('Name is required'); isValid = false; }
                else { data = { name: name.value.trim() }; }
            } else if (type === 'reviews') {
                const quote = document.getElementById('f_quote');
                const customer = document.getElementById('f_customer');
                if (!quote || !quote.value.trim()) { showToast('Quote is required'); isValid = false; }
                else if (!customer || !customer.value.trim()) { showToast('Customer is required'); isValid = false; }
                else {
                    data = {
                        quote: quote.value.trim(),
                        customer: customer.value.trim(),
                        stars: parseInt(document.getElementById('f_stars').value) || 5
                    };
                }
            } else if (type === 'results') {
                const image = document.getElementById('f_image');
                const title = document.getElementById('f_title');
                const badge = document.getElementById('f_badge');
                if (!image || !image.value.trim()) { showToast('Image URL is required'); isValid = false; }
                else if (!title || !title.value.trim()) { showToast('Title is required'); isValid = false; }
                else if (!badge || !badge.value) { showToast('Badge is required'); isValid = false; }
                else {
                    data = {
                        image: image.value.trim(),
                        title: title.value.trim(),
                        badge: badge.value
                    };
                }
            } else if (type === 'announcements') {
                const text = document.getElementById('f_text');
                if (!text || !text.value.trim()) { showToast('Announcement text is required'); isValid = false; }
                else {
                    data = {
                        text: text.value.trim(),
                        active: document.getElementById('f_status').value === 'active',
                        date: getMalaysiaTime()
                    };
                }
            } else if (type === 'popups') {
                const title = document.getElementById('f_title');
                const text = document.getElementById('f_text');
                if (!title || !title.value.trim()) { showToast('Title is required'); isValid = false; }
                else if (!text || !text.value.trim()) { showToast('Description is required'); isValid = false; }
                else {
                    data = {
                        icon: document.getElementById('f_icon').value.trim() || '🎉',
                        title: title.value.trim(),
                        text: text.value.trim(),
                        btnText: document.getElementById('f_btn_text').value.trim() || 'Shop Now',
                        link: document.getElementById('f_link').value.trim() || '',
                        active: document.getElementById('f_status').value === 'active',
                        date: getMalaysiaTime()
                    };
                }
            } else {
                showToast('Unknown type');
                isValid = false;
            }
        } catch (err) {
            showToast('Error: ' + err.message);
            isValid = false;
        }

        if (!isValid) {
            submitBtn.disabled = false;
            submitBtn.textContent = submitBtn.dataset.originalText || 'Save';
            submitBtn.style.cursor = 'pointer';
            submitBtn.style.opacity = '1';
            return;
        }

        const idEl = document.getElementById('f_id');
        const id = idEl ? idEl.value : null;
        const finalId = id || generateId();

        db.ref(type + '/' + finalId).set(data)
            .then(() => {
                showToast('Saved successfully');
                closeModal();
                submitBtn.disabled = false;
                submitBtn.textContent = submitBtn.dataset.originalText || 'Save';
                submitBtn.style.cursor = 'pointer';
                submitBtn.style.opacity = '1';
            })
            .catch((err) => {
                showToast('Error: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = submitBtn.dataset.originalText || 'Save';
                submitBtn.style.cursor = 'pointer';
                submitBtn.style.opacity = '1';
            });
    });

    // ============================================================
    // FIREBASE LISTENERS
    // ============================================================
    function initApp() {
        db.ref('orderCounter').once('value').then(snap => {
            orderIdCounter = snap.val() || 0;
        });

        db.ref('categories').on('value', snap => {
            const data = snap.val() || {};
            categories = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (currentTab === 'categories' || currentTab === 'services' || currentTab === 'results' || currentTab === 'dashboard') renderContent();
            document.getElementById('categoryCount').textContent = categories.length;
        });

        db.ref('services').on('value', snap => {
            const data = snap.val() || {};
            services = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (currentTab === 'services' || currentTab === 'dashboard') renderContent();
            document.getElementById('serviceCount').textContent = services.length;
        });

        db.ref('reviews').on('value', snap => {
            const data = snap.val() || {};
            reviews = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (currentTab === 'reviews' || currentTab === 'dashboard') renderContent();
            document.getElementById('reviewCount').textContent = reviews.length;
        });

        db.ref('results').on('value', snap => {
            const data = snap.val() || {};
            results = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (currentTab === 'results' || currentTab === 'dashboard') renderContent();
            document.getElementById('resultCount').textContent = results.length;
        });

        db.ref('orders').on('value', snap => {
            const data = snap.val() || {};
            orders = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (orders.length > 0) {
                const maxId = orders.reduce((max, o) => {
                    const orderId = o.orderId || o.id || '';
                    const match = orderId.match(/SOC-\d{8}-(\d{3})/);
                    if (match) {
                        const num = parseInt(match[1]);
                        return num > max ? num : max;
                    }
                    return max;
                }, 0);
                if (maxId > orderIdCounter) {
                    orderIdCounter = maxId;
                    db.ref('orderCounter').set(orderIdCounter);
                }
            }
            if (currentTab === 'orders' || currentTab === 'dashboard') renderContent();
            document.getElementById('orderCount').textContent = orders.length;
        });

        db.ref('announcements').on('value', snap => {
            const data = snap.val() || {};
            announcements = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (currentTab === 'announcements') renderContent();
            document.getElementById('announceCount').textContent = announcements.length;
        });

        db.ref('popups').on('value', snap => {
            const data = snap.val() || {};
            popups = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            if (currentTab === 'popups') renderContent();
            document.getElementById('popupCount').textContent = popups.length;
        });

        db.ref('settings').on('value', snap => {
            const data = snap.val() || {};
            settings = { discountPercent: data.discountPercent || 10, minPurchase: data.minPurchase || 10 };
            if (currentTab === 'customization') renderContent();
        });

        db.ref('read').on('value', snap => {
            readContent = snap.val() || '';
            if (currentTab === 'read') renderContent();
        });

        renderContent();
    }

    // ============================================================
    // INIT
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);

    document.getElementById('receiptModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('open');
    });

    console.log('✅ Admin panel ready');
    console.log('✅ Order ID FIXED - guna orderId dari Firebase');
    console.log('✅ Login mobile fixed - no overlap, no scroll');
    console.log('✅ Edit/Delete buttons same design all tabs');
</script>
