<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Socmegy · Social Media Boost</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== HIDE ALL SCROLLBARS ===== */
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        body { overflow-y: scroll; }

        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 0;
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .app {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            transition: background 0.3s;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .app-content { flex: 1; }

        /* ===== DARK MODE ===== */
        body.dark-mode {
            background: #1a1a1a;
            color: #e8e8e8;
        }
        body.dark-mode .app { background: #1a1a1a; }
        body.dark-mode .navbar {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        body.dark-mode .navbar .logo .brand { color: #d4a017; }
        body.dark-mode .navbar .nav-links a { color: #d4a017; }
        body.dark-mode .service-card { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .service-card .info .name { color: #d4a017; }
        body.dark-mode .service-card .info .desc { color: #8e8e93; }
        body.dark-mode .service-card .price-row .price { background: #3a3a3a; color: #d4a017; }
        body.dark-mode .dropdown-btn { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.05); color: #d4a017; }
        body.dark-mode .dropdown-btn:hover { background: #3a3a3a; }
        body.dark-mode .dropdown-body { background: #1a1a1a; }
        body.dark-mode .custom-wrap .custom-card { background: rgba(30, 30, 30, 0.95); }
        body.dark-mode .custom-wrap .custom-card .desc { color: #d4a017; }
        body.dark-mode .custom-wrap .custom-card .picker .opt { background: #2a2a2a; }
        body.dark-mode .custom-wrap .custom-card .picker .opt .left { color: #d4a017; }
        body.dark-mode .custom-wrap .custom-card .summary { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .custom-wrap .custom-card .summary .item { color: #d4a017; }
        body.dark-mode .reviews-scroll .review { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .reviews-scroll .review .quote { color: #d4a017; }
        body.dark-mode .reviews-scroll .review .customer { color: #8e8e93; }
        body.dark-mode .results-scroll .result { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .results-scroll .result .info .title { color: #d4a017; }
        body.dark-mode .footer { background: #2a2a2a; border-top: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .modal { background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .modal .modal-header h2 { color: #d4a017; }
        body.dark-mode .modal .modal-body .empty { color: #8e8e93; }
        body.dark-mode .modal .modal-footer .btn-checkout { background: #d4a017; }
        body.dark-mode .cart-suggestions .suggest-item .suggest-name { color: #e8e8e8; }
        body.dark-mode .cart-suggestions .suggest-item .suggest-price-wrap .suggest-price { color: #d4a017; }
        body.dark-mode .toast { background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .toast .toast-content .toast-title { color: #e8e8e8; }
        body.dark-mode .toast .toast-content .toast-sub { color: #8e8e93; }
        body.dark-mode .mobile-nav { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        body.dark-mode .mobile-nav a { color: #d4a017; }
        body.dark-mode #readModal .modal-body .read-section ul { color: #8e8e93; }
        body.dark-mode #readModal .modal-body .read-section ul li strong { color: #d4a017; }
        body.dark-mode .track-wrap .track-card { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .track-wrap .track-card .order-item { border: 1px solid rgba(255,255,255,0.05); background: #1a1a1a; }
        body.dark-mode .track-wrap .track-card .order-detail { background: #1a1a1a; }
        body.dark-mode .track-wrap .track-card .receipt { background: #1a1a1a; border-color: rgba(255,255,255,0.1); color: #e8e8e8; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-header .title { color: #e8e8e8; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-header .sub { color: #8e8e93; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-row .label { color: #8e8e93; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-row .value { color: #e8e8e8; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-total { border-top-color: #555555; color: #e8e8e8; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-footer { color: #8e8e93; border-top-color: #333333; }
        body.dark-mode .track-wrap .track-card .receipt .receipt-divider { border-top-color: #333333; }
        body.dark-mode .announcement-bar { background: rgba(40, 40, 40, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); }
        body.dark-mode .announcement-bar .announce-text { color: #d4a017; }
        body.dark-mode .popup-modal { background: #2a2a2a; }
        body.dark-mode .popup-modal .popup-desc { color: #8e8e93; }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select {
            color: #e8e8e8 !important;
            background: #2a2a2a !important;
            border-color: rgba(255,255,255,0.08) !important;
        }
        body.dark-mode input:focus, body.dark-mode textarea:focus, body.dark-mode select:focus {
            border-color: #d4a017 !important;
            outline: none !important;
        }
        body.dark-mode input::placeholder, body.dark-mode textarea::placeholder {
            color: #a8a8a8 !important;
            opacity: 1 !important;
            font-size: 14px !important;
        }
        body.dark-mode .track-wrap .track-card .search-label strong,
        body.dark-mode .track-wrap .track-card .search-label { color: #d4a017 !important; }
        body.dark-mode .track-wrap .track-card .order-item .order-id { color: #d4a017 !important; }
        body.dark-mode .track-wrap .track-card .order-item .order-meta { color: #8e8e93 !important; }
        body.dark-mode .track-wrap .track-card .order-item .order-date { color: #8e8e93 !important; }
        body.dark-mode .modal .form-group label { color: #d4a017 !important; }
        body.dark-mode .modal .checkout-summary span { color: #d4a017 !important; }
        body.dark-mode .modal .modal-body .empty { color: #8e8e93 !important; }
        body.dark-mode .modal input, body.dark-mode .modal textarea, body.dark-mode .modal select {
            color: #e8e8e8 !important;
            background: #2a2a2a !important;
            border-color: rgba(255,255,255,0.08) !important;
        }
        body.dark-mode .modal input:focus, body.dark-mode .modal textarea:focus { border-color: #d4a017 !important; }
        body.dark-mode .modal input::placeholder, body.dark-mode .modal textarea::placeholder {
            color: #a8a8a8 !important;
            opacity: 1 !important;
            font-size: 14px !important;
        }

        /* ===== DARK MODE - PAYMENT METHOD GOLD ===== */
        body.dark-mode .modal label span div {
            color: #d4a017 !important;
        }
        body.dark-mode .modal label span span {
            color: #d4a017 !important;
        }
        body.dark-mode .modal label span .payment-sub {
            color: #d4a017 !important;
        }
        body.dark-mode .payment-method-label .payment-sub {
            color: #d4a017 !important;
        }

        /* ===== DARK MODE - CUSTOM BUTTONS ===== */
        body.dark-mode .custom-wrap .custom-card .actions .btn-secondary {
            background: #4a4a4a !important;
            color: #d4a017 !important;
        }
        body.dark-mode .custom-wrap .custom-card .actions .btn-secondary:hover {
            background: #5a5a5a !important;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-btn {
            background: #4a4a4a !important;
            color: #d4a017 !important;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-btn:hover {
            background: #5a5a5a !important;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-num {
            color: #d4a017 !important;
        }

        /* ===== ANNOUNCEMENT BAR ===== */
        .announcement-bar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            padding: 8px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            overflow: hidden;
            position: relative;
            z-index: 49;
            transition: background 0.3s;
        }
        .announcement-bar .announce-icon { color: #b8860b; font-size: 14px; flex-shrink: 0; }
        .announcement-bar .announce-text { flex: 1; font-size: 13px; font-weight: 500; color: #b8860b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .announcement-bar .announce-close { background: none; border: none; color: #8e8e93; cursor: pointer; font-size: 16px; flex-shrink: 0; padding: 4px; }
        .announcement-bar .announce-close:hover { color: #1d1d1f; }
        .announcement-bar .announce-multiple { display: flex; gap: 4px; flex-shrink: 0; }
        .announcement-bar .announce-dot { width: 6px; height: 6px; border-radius: 50%; background: #d2d2d7; cursor: pointer; transition: background 0.3s; }
        .announcement-bar .announce-dot.active { background: #b8860b; }

        /* ===== PROMOTIONAL POPUP ===== */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 20px;
        }
        .popup-overlay.open { display: flex; }
        .popup-modal {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 28px 28px;
            max-width: 400px;
            width: 100%;
            position: relative;
            animation: popupIn 0.4s ease;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
        }
        @keyframes popupIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .popup-modal .popup-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #8e8e93; }
        .popup-modal .popup-close:hover { color: #1d1d1f; }
        .popup-modal .popup-icon { font-size: 48px; text-align: center; margin-bottom: 10px; }
        .popup-modal .popup-title { color: #b8860b; font-size: 24px; font-weight: 700; text-align: center; }
        .popup-modal .popup-desc { color: #6e6e73; margin: 10px 0 16px; font-size: 15px; line-height: 1.6; text-align: center; }
        .popup-modal .popup-btn { padding: 12px 32px; background: #b8860b; color: #fff; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 15px; width: 100%; transition: opacity 0.2s; }
        .popup-modal .popup-btn:hover { opacity: 0.85; }

        /* ===== HEADER / NAVBAR ===== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
            transition: background 0.3s, border-color 0.3s;
        }
        .navbar .logo { display: flex; align-items: center; gap: 10px; }
        .navbar .logo img { height: 36px; width: 36px; border-radius: 50%; object-fit: cover; vertical-align: middle; }
        .navbar .logo .brand { font-size: 22px; font-weight: 700; color: #b8860b; letter-spacing: -0.5px; transition: color 0.3s; }
        .navbar .nav-links { display: flex; gap: 32px; align-items: center; }
        .navbar .nav-links a { text-decoration: none; color: #b8860b; font-size: 14px; font-weight: 500; transition: color 0.2s; padding: 4px 0; cursor: pointer; }
        .navbar .nav-links a:hover { color: #d4a017; }
        .navbar .nav-links .custom-badge {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff !important;
            font-weight: 500;
            padding: 4px 16px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .navbar .nav-links .custom-badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 30%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.3) 70%, transparent 100%);
            animation: shimmer 3s infinite ease-in-out;
            transform: skewX(-25deg);
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) skewX(-25deg); }
            100% { transform: translateX(100%) skewX(-25deg); }
        }
        .navbar .nav-links .custom-badge:hover { color: #ffffff !important; opacity: 0.85; }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        .navbar .nav-right .dark-toggle {
            background: rgba(0,0,0,0.04);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: #b8860b;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar .nav-right .dark-toggle:hover { background: rgba(0,0,0,0.08); }
        body.dark-mode .navbar .nav-right .dark-toggle { background: rgba(255,255,255,0.08); }
        body.dark-mode .navbar .nav-right .dark-toggle:hover { background: rgba(255,255,255,0.15); }
        .navbar .nav-right .cart-wrap { position: relative; cursor: pointer; display: flex; align-items: center; }
        .navbar .nav-right .cart-wrap .badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #b8860b;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 30px;
            min-width: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar .nav-right .btn-read { background: #b8860b; border: none; padding: 6px 16px; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; color: #ffffff; }
        .navbar .nav-right .btn-read i { color: #ffffff; }
        .navbar .nav-right .btn-read:hover { background: #d4a017; }
        .hamburger { display: none; background: transparent; border: none; font-size: 24px; cursor: pointer; color: #b8860b; }

        /* ===== HERO ===== */
        .hero {
            padding: 40px 40px 32px;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            text-align: center;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }
        .hero h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; color: #ffffff; text-align: center; width: 100%; }
        .hero h1 i { color: #ffffff; margin-right: 6px; }
        .hero p { font-size: 17px; color: #ffffff; max-width: 540px; margin: 0 auto 16px; line-height: 1.5; opacity: 0.9; text-align: center; width: 100%; }
        .hero .stats { display: flex; justify-content: center; gap: 40px; width: 100%; flex-wrap: wrap; margin-top: 4px; }
        .hero .stats .stat { display: flex; flex-direction: column; align-items: center; }
        .hero .stats .stat .num { font-size: 26px; font-weight: 700; color: #ffffff; }
        .hero .stats .stat .label { font-size: 12px; color: #ffffff; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.8; }

        /* ===== SECTION ===== */
        .section { padding: 0 40px 0px; margin-top: 40px; width: 100%; }
        .section-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 20px; color: #b8860b; }
        .section-title .gold { color: #b8860b; }
        .section-title .info-icon-gold { color: #b8860b; font-size: 20px; cursor: pointer; margin-left: 6px; transition: opacity 0.2s; display: inline-block; vertical-align: middle; line-height: 1; }
        .section-title .info-icon-gold:hover { opacity: 0.7; }

        /* ===== SERVICES ===== */
        .dropdown-wrap { display: flex; flex-direction: column; gap: 10px; }
        .dropdown-btn {
            background: #f8f8fa;
            border: 1px solid #eaeaee;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            width: 100%;
            color: #b8860b;
        }
        .dropdown-btn:hover { background: #f0f0f2; }
        .dropdown-btn .arrow { transition: transform 0.3s; }
        .dropdown-btn .arrow.open { transform: rotate(180deg); }
        .dropdown-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.3s ease;
            padding: 0;
            background: #ffffff;
            overflow-y: auto;
        }
        .dropdown-body.open { max-height: 2000px; padding: 10px 0; }
        .dropdown-body .service-list { display: flex; flex-direction: column; gap: 8px; }

        .service-card {
            background: #f8f8fa;
            border-radius: 14px;
            padding: 14px 20px;
            border: 1px solid #eaeaee;
            transition: box-shadow 0.2s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            width: 100%;
            position: relative;
        }
        .service-card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04); }
        .service-card .info { flex: 1; min-width: 80px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .service-card .info .name { font-size: 13px; font-weight: 600; color: #b8860b; }
        .service-card .info .discount-badge { background: #b8860b; color: #ffffff; font-size: 9px; font-weight: 600; padding: 1px 8px; border-radius: 30px; }
        .service-card .info .desc { font-size: 11px; color: #6e6e73; width: 100%; }
        .service-card .price-row { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; margin-left: auto; flex-shrink: 0; }
        .service-card .price-row .price { font-weight: 700; font-size: 13px; background: #e8e8ed; padding: 2px 10px; border-radius: 30px; color: #b8860b; }
        .service-card .price-row .original { font-size: 11px; color: #8e8e93; text-decoration: line-through; flex-shrink: 0; }
        .service-card .btn-add { background: #b8860b; color: #ffffff; border: none; padding: 5px 14px; border-radius: 30px; font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.2s; flex-shrink: 0; white-space: nowrap; }
        .service-card .btn-add:hover { background: #d4a017; }
        .service-card .btn-add:disabled { background: #c7c7cc; color: #8e8e93; cursor: not-allowed; }
        .service-card .unavailable-tag { color: #8e8e93; font-size: 10px; font-weight: 600; background: #f0f0f0; padding: 2px 10px; border-radius: 30px; display: inline-block; }

        /* ===== NEW STAMP WITH SHIMMER ===== */
        .new-stamp {
            display: inline-block;
            color: #b8860b;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            border: 2px solid #b8860b;
            padding: 0 6px;
            border-radius: 2px;
            line-height: 1.3;
            background: rgba(184, 134, 11, 0.08);
            margin-right: 3px;
            transform: rotate(-3deg);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .new-stamp::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent 0%, rgba(184,134,11,0.15) 30%, rgba(184,134,11,0.3) 50%, rgba(184,134,11,0.15) 70%, transparent 100%);
            animation: stampShimmer 4s infinite ease-in-out;
            transform: skewX(-25deg);
        }
        @keyframes stampShimmer {
            0% { transform: translateX(-100%) skewX(-25deg); }
            100% { transform: translateX(100%) skewX(-25deg); }
        }

        /* ===== CUSTOM PACKAGE ===== */
        .custom-wrap {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            padding: 16px;
            width: 100%;
        }
        .custom-wrap .custom-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 12px 14px;
            position: relative;
        }
