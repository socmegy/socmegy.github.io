<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Pembayaran Berjaya - Socmegy</title>
    <link rel="icon" href="logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 0;
        }

        ::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 460px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 0;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== HEADER ===== */
        .receipt-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid #eef0f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #d4a84c;
            letter-spacing: -0.3px;
        }

        .header-right {
            text-align: right;
            flex-shrink: 0;
        }

        .header-right .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9aa4b0;
            font-weight: 600;
        }

        .header-right .number {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a2634;
            letter-spacing: 0.3px;
        }

        .header-right .date {
            font-size: 0.6rem;
            color: #9aa4b0;
        }

        /* ===== BODY ===== */
        .receipt-body {
            padding: 20px 24px 16px;
        }

        /* ===== STATUS ===== */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            margin-bottom: 18px;
            border-bottom: 1px solid #eef0f2;
        }

        .status-text {
            font-size: 0.75rem;
            font-weight: 500;
            color: #1a2634;
        }

        .status-text i {
            color: #2e9c5e;
            margin-right: 6px;
        }

        .status-time {
            font-size: 0.6rem;
            color: #9aa4b0;
            font-weight: 400;
        }

        /* ===== PELANGGAN ===== */
        .customer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 20px;
            margin-bottom: 20px;
            padding: 0;
        }

        .customer-grid .field {
            display: flex;
            flex-direction: column;
        }

        .customer-grid .field.full {
            grid-column: 1 / -1;
        }

        .customer-grid .field .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9aa4b0;
            font-weight: 600;
        }

        .customer-grid .field .value {
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a2634;
            word-break: break-word;
        }

        .customer-grid .field .value.note {
            font-weight: 400;
            color: #6b7a8a;
            font-size: 0.7rem;
        }

        /* ===== ITEMS ===== */
        .items-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9aa4b0;
            font-weight: 600;
            padding-bottom: 8px;
            border-bottom: 1px solid #eef0f2;
            margin-bottom: 8px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid #f0f2f4;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-left .name {
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a2634;
        }

        .item-left .meta {
            font-size: 0.6rem;
            color: #9aa4b0;
            margin-top: 1px;
        }

        .item-left .meta i {
            margin: 0 4px;
            font-size: 0.4rem;
            color: #c5cdd5;
        }

        .item-right {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d4a84c;
        }

        /* ===== SUMMARY ===== */
        .summary-box {
            padding: 12px 0 0;
            margin-top: 8px;
            border-top: 1px solid #eef0f2;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            padding: 3px 0;
            color: #6b7a8a;
        }

        .summary-row .label {
            color: #9aa4b0;
        }

        .summary-row .amount {
            font-weight: 500;
            color: #1a2634;
        }

        .summary-row.total {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a2634;
            padding-top: 6px;
            border-top: 1px solid #eef0f2;
            margin-top: 4px;
        }

        .summary-row.total .amount {
            color: #d4a84c;
            font-size: 1.05rem;
        }

        /* ===== FOOTER ===== */
        .receipt-footer {
            padding: 16px 24px 20px;
            border-top: 1px solid #eef0f2;
            text-align: center;
        }

        .footer-note {
            font-size: 0.6rem;
            color: #9aa4b0;
            line-height: 1.8;
        }

        .footer-note .gold {
            color: #d4a84c;
            font-weight: 500;
        }

        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .footer-actions button,
        .footer-actions a {
            background: transparent;
            border: 1px solid #e8eaed;
            border-radius: 30px;
            padding: 6px 18px;
            color: #6b7a8a;
            font-size: 0.6rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .footer-actions button:hover,
        .footer-actions a:hover {
            background: #d4a84c;
            border-color: #d4a84c;
            color: #ffffff;
        }

        .footer-actions button:hover i,
        .footer-actions a:hover i {
            color: #ffffff;
        }

        .footer-actions button i,
        .footer-actions a i {
            font-size: 0.5rem;
            color: #d4a84c;
            transition: color 0.2s;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { border-radius: 12px; }
            .receipt-header {
                padding: 16px 16px 12px;
                gap: 8px;
                flex-wrap: wrap;
            }
            .brand { gap: 8px; }
            .brand-icon { width: 34px; height: 34px; }
            .brand-name { font-size: 0.95rem; }
            .header-right { text-align: right; }
            .header-right .number { font-size: 0.7rem; }
            .header-right .date { font-size: 0.55rem; }
            .header-right .label { font-size: 0.45rem; }
            .receipt-body { padding: 14px 16px 12px; }
            .status-bar { padding: 6px 0; }
            .status-text { font-size: 0.7rem; }
            .status-time { font-size: 0.55rem; }
            .customer-grid {
                grid-template-columns: 1fr;
                gap: 2px;
            }
            .customer-grid .field.full { grid-column: 1; }
            .customer-grid .field .value { font-size: 0.75rem; }
            .item-row { padding: 6px 0; }
            .item-left .name { font-size: 0.7rem; }
            .item-right { font-size: 0.75rem; }
            .summary-box { padding: 8px 0 0; }
            .summary-row { font-size: 0.65rem; }
            .summary-row.total { font-size: 0.8rem; }
            .summary-row.total .amount { font-size: 0.9rem; }
            .receipt-footer { padding: 12px 16px 16px; }
            .footer-note { font-size: 0.55rem; }
            .footer-actions button,
            .footer-actions a { padding: 4px 14px; font-size: 0.5rem; }
        }

        @media (max-width: 380px) {
            .receipt-header {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .brand { flex: 1; min-width: 120px; }
            .header-right { text-align: right; flex: 0 0 auto; }
            .brand-name { font-size: 0.85rem; }
            .brand-icon { width: 30px; height: 30px; }
            .header-right .number { font-size: 0.6rem; }
        }

        /* ============================================================
                   PRINT STYLES — FULL PAGE, SAMA DESIGN, TAK CENTER
                   ============================================================ */
        @media print {
            /* Reset body — full page, no center, no box */
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                min-height: auto !important;
                align-items: normal !important;
                justify-content: normal !important;
            }

            /* Hilangkan overlay */
            body::before {
                display: none !important;
            }

            /* Container — full width, no border, no shadow, no center */
            .container {
                max-width: 100% !important;
                width: 100% !important;
                background: #ffffff !important;
                border-radius: 0 !important;
                padding: 20px 24px !important;
                box-shadow: none !important;
                border: none !important;
                overflow: visible !important;
                animation: none !important;
                margin: 0 !important;
            }

            /* Header */
            .receipt-header {
                padding: 0 0 16px 0 !important;
                border-bottom: 1px solid #eef0f2 !important;
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
            }

            .brand-icon {
                width: 40px !important;
                height: 40px !important;
                background: #f5f6f8 !important;
            }

            .brand-name {
                font-size: 1.1rem !important;
                font-weight: 700 !important;
                color: #d4a84c !important;
            }

            .header-right .label {
                font-size: 0.5rem !important;
                color: #9aa4b0 !important;
            }
            .header-right .number {
                font-size: 0.8rem !important;
                color: #1a2634 !important;
            }
            .header-right .date {
                font-size: 0.6rem !important;
                color: #9aa4b0 !important;
            }

            /* Body */
            .receipt-body {
                padding: 16px 0 12px !important;
            }

            /* Status */
            .status-bar {
                display: flex !important;
                align-items: center !important;
                justify-content: space-between !important;
                padding: 8px 0 !important;
                margin-bottom: 16px !important;
                border-bottom: 1px solid #eef0f2 !important;
            }
            .status-text {
                font-size: 0.75rem !important;
                color: #1a2634 !important;
            }
            .status-text i {
                color: #2e9c5e !important;
            }
            .status-time {
                font-size: 0.6rem !important;
                color: #9aa4b0 !important;
            }

            /* Customer */
            .customer-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 2px 20px !important;
                margin-bottom: 16px !important;
                padding: 0 !important;
            }
            .customer-grid .field.full {
                grid-column: 1 / -1 !important;
            }
            .customer-grid .field .label {
                font-size: 0.5rem !important;
                color: #9aa4b0 !important;
            }
            .customer-grid .field .value {
                font-size: 0.8rem !important;
                color: #1a2634 !important;
            }
            .customer-grid .field .value.note {
                color: #6b7a8a !important;
                font-size: 0.7rem !important;
            }

            /* Items */
            .items-header {
                display: flex !important;
                justify-content: space-between !important;
                font-size: 0.5rem !important;
                color: #9aa4b0 !important;
                padding-bottom: 8px !important;
                border-bottom: 1px solid #eef0f2 !important;
                margin-bottom: 6px !important;
            }
            .item-row {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding: 5px 0 !important;
                border-bottom: 1px solid #f0f2f4 !important;
            }
            .item-row:last-child {
                border-bottom: none !important;
            }
            .item-left .name {
                font-size: 0.8rem !important;
                color: #1a2634 !important;
            }
            .item-left .meta {
                font-size: 0.6rem !important;
                color: #9aa4b0 !important;
            }
            .item-right {
                font-size: 0.85rem !important;
                color: #d4a84c !important;
            }

            /* Summary */
            .summary-box {
                padding: 10px 0 0 !important;
                margin-top: 6px !important;
                border-top: 1px solid #eef0f2 !important;
            }
            .summary-row {
                display: flex !important;
                justify-content: space-between !important;
                font-size: 0.7rem !important;
                padding: 2px 0 !important;
                color: #6b7a8a !important;
            }
            .summary-row .label {
                color: #9aa4b0 !important;
            }
            .summary-row .amount {
                color: #1a2634 !important;
            }
            .summary-row.total {
                font-size: 0.95rem !important;
                color: #1a2634 !important;
                padding-top: 6px !important;
                border-top: 1px solid #eef0f2 !important;
                margin-top: 4px !important;
            }
            .summary-row.total .amount {
                color: #d4a84c !important;
                font-size: 1.05rem !important;
            }

            /* Footer */
            .receipt-footer {
                padding: 12px 0 0 !important;
                border-top: 1px solid #eef0f2 !important;
                text-align: center !important;
            }
            .footer-note {
                font-size: 0.6rem !important;
                color: #9aa4b0 !important;
            }
            .footer-note .gold {
                color: #d4a84c !important;
            }

            /* Sembunyikan butang action semasa print */
            .footer-actions {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="receipt-header">
            <div class="brand">
                <div class="brand-icon">
                    <img src="logo.png" alt="Socmegy" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-crown\' style=\'color:#d4a84c;font-size:18px;\'></i>';" />
                </div>
                <span class="brand-name">Socmegy</span>
            </div>
            <div class="header-right">
                <div class="label">Resit</div>
                <div class="number" id="orderId">#ORDER-1784095771894</div>
                <div class="date" id="orderDate">15 Julai 2025</div>
            </div>
        </div>

        <!-- ===== BODY ===== -->
        <div class="receipt-body">

            <!-- Status -->
            <div class="status-bar">
                <span class="status-text"><i class="fas fa-check-circle"></i> Bayaran Berjaya</span>
                <span class="status-time" id="orderTime">02:52 PTG</span>
            </div>

            <!-- Pelanggan -->
            <div class="customer-grid">
                <div class="field">
                    <span class="label">Nama</span>
                    <span class="value" id="customerName">Pelanggan</span>
                </div>
                <div class="field">
                    <span class="label">Telefon</span>
                    <span class="value" id="customerPhone">--</span>
                </div>
                <div class="field full">
                    <span class="label">E-mel</span>
                    <span class="value" id="customerEmail">--</span>
                </div>
                <div class="field full">
                    <span class="label">Catatan</span>
                    <span class="value note" id="orderNote">-</span>
                </div>
            </div>

            <!-- Items -->
            <div class="items-header">
                <span>Perkhidmatan</span>
                <span>Jumlah</span>
            </div>
            <div id="receiptItems">
                <!-- JS akan isi -->
            </div>

            <!-- Summary -->
            <div class="summary-box">
                <div class="summary-row">
                    <span class="label">Subjumlah</span>
                    <span class="amount" id="subtotalDisplay">RM0.00</span>
                </div>
                <div class="summary-row">
                    <span class="label">Caj Perkhidmatan</span>
                    <span class="amount">RM0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Jumlah</span>
                    <span class="amount" id="orderTotal">RM0.00</span>
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="receipt-footer">
            <div class="footer-note">
                Terima kasih atas kepercayaan anda. <span class="gold">Socmegy</span> — Tingkatkan Kehadiran Digital Anda.
            </div>
            <div class="footer-actions">
                <button onclick="window.print()"><i class="fas fa-print"></i> Cetak</button>
                <a href="https://muhdzulhelmibinsaidan.github.io/socmegy/"><i class="fas fa-home"></i> Utama</a>
                <a href="https://muhdzulhelmibinsaidan.github.io/socmegy/#services"><i class="fas fa-shopping-bag"></i> Beli Lagi</a>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // GET ORDER DATA
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        let orderData = null;
        const orderDataParam = urlParams.get('data');
        
        if (orderDataParam) {
            try {
                orderData = JSON.parse(decodeURIComponent(orderDataParam));
            } catch(e) { console.error('Failed to parse order data:', e); }
        }

        if (!orderData) {
            try {
                const savedOrder = localStorage.getItem('socmegy_last_order');
                if (savedOrder) orderData = JSON.parse(savedOrder);
            } catch(e) {}
        }

        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        const timeOptions = { hour: '2-digit', minute: '2-digit' };
        
        const defaultOrder = {
            orderId: 'ORDER-' + Date.now(),
            date: now.toLocaleDateString('ms-MY', options),
            time: now.toLocaleTimeString('ms-MY', timeOptions),
            customer: { name: 'Pelanggan', email: '--', phone: '--' },
            items: [{ name: 'Perkhidmatan Socmegy', qty: 1, price: 0 }],
            total: 0,
            note: '-'
        };

        const order = orderData ? { ...defaultOrder, ...orderData } : defaultOrder;
        if (order.customer) {
            order.customer = { ...defaultOrder.customer, ...order.customer };
        }

        // ============================================================
        // RENDER
        // ============================================================
        document.getElementById('orderId').textContent = '#' + (order.orderId || 'ORDER-0000');
        document.getElementById('orderDate').textContent = order.date || now.toLocaleDateString('ms-MY', options);
        document.getElementById('orderTime').textContent = order.time || now.toLocaleTimeString('ms-MY', timeOptions);
        document.getElementById('customerName').textContent = order.customer?.name || '--';
        document.getElementById('customerEmail').textContent = order.customer?.email || '--';
        document.getElementById('customerPhone').textContent = order.customer?.phone || '--';
        document.getElementById('orderNote').textContent = order.note || '-';
        document.getElementById('orderTotal').textContent = 'RM' + (order.total || 0).toFixed(2);

        const container = document.getElementById('receiptItems');
        let subtotal = 0;
        let html = '';

        if (order.items && order.items.length > 0) {
            order.items.forEach(item => {
                const qty = item.qty || 1;
                const price = item.price || 0;
                const total = price * qty;
                subtotal += total;

                html += `
                    <div class="item-row">
                        <div class="item-left">
                            <div class="name">${item.name}</div>
                            <div class="meta">
                                <i class="fas fa-times"></i> ${qty} unit
                                <i class="fas fa-tag"></i> RM${price.toFixed(2)}
                            </div>
                        </div>
                        <div class="item-right">RM${total.toFixed(2)}</div>
                    </div>
                `;
            });
        } else {
            html = `
                <div style="text-align:center;padding:20px 0;color:#9aa4b0;font-size:0.7rem;">
                    <i class="fas fa-box" style="display:block;margin-bottom:6px;font-size:1.2rem;color:#c5cdd5;"></i>
                    Tiada item
                </div>
            `;
        }

        container.innerHTML = html;
        document.getElementById('subtotalDisplay').textContent = 'RM' + subtotal.toFixed(2);

        try { localStorage.removeItem('socmegy_cart'); } catch (_) {}
        try { localStorage.setItem('socmegy_last_order', JSON.stringify(order)); } catch (_) {}

        console.log('✅ Success page loaded. Order:', order.orderId);
    </script>

</body>
</html>
