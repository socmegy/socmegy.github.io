<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Socmegy · Custom Package</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
            border: 1px solid #eaeaee;
            position: relative;
            overflow: hidden;
        }

        /* ===== DARK MODE ===== */
        body.dark-mode {
            background: #1a1a1a;
        }
        body.dark-mode .app {
            background: #1a1a1a;
            border-color: rgba(255,255,255,0.06);
        }
        body.dark-mode .custom-wrap .custom-card {
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.05);
        }
        body.dark-mode .custom-wrap .custom-card .desc {
            color: #d4a017;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt {
            background: #1a1a1a;
            border-color: rgba(255,255,255,0.06);
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .left {
            color: #d4a017;
        }
        body.dark-mode .custom-wrap .custom-card .summary {
            background: #1a1a1a;
            border-color: rgba(255,255,255,0.06);
        }
        body.dark-mode .custom-wrap .custom-card .summary .item {
            color: #d4a017;
            border-bottom-color: rgba(255,255,255,0.06);
        }
        body.dark-mode .custom-wrap .custom-card .summary .total-row {
            color: #d4a017;
            border-top-color: rgba(255,255,255,0.1);
        }
        body.dark-mode .custom-wrap .custom-card .actions .btn-secondary {
            background: #3a3a3a;
            color: #d4a017;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-btn {
            background: #3a3a3a;
            color: #d4a017;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-num {
            color: #d4a017;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .final-price {
            color: #d4a017;
        }

        /* ===== CUSTOM SECTION - SAMA MACAM ASAL ===== */
        .section { padding: 0; margin-top: 0; width: 100%; }
        .section-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            color: #b8860b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .gold { color: #b8860b; }

        #custom .section-title,
        #custom .section-title .gold,
        #custom .section-title .gold-icon {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #custom .section-title .gold-icon {
            font-size: 22px;
            display: inline-block;
            vertical-align: middle;
            position: relative;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        #custom .section-title .gold-icon.wand-hidden {
            opacity: 0;
        }
        #custom .section-title .gold-icon.wand-visible {
            opacity: 1;
        }

        .custom-wrap {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            position: relative;
        }
        .custom-wrap .custom-card {
            background: #ffffff;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 12px 14px;
            position: relative;
            z-index: 2;
        }
        .custom-wrap .custom-card .desc {
            font-size: 13px;
            color: #b8860b;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .custom-wrap .custom-card .picker {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
            position: relative;
        }
        .custom-wrap .custom-card .picker .opt {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 4px;
            position: relative;
            border: 1px solid #eaeaee;
            transition: all 0.3s ease;
        }
        .custom-wrap .custom-card .picker .opt .left {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 500;
            color: #b8860b;
        }
        .custom-wrap .custom-card .picker .opt .left .discount-badge {
            background: #b8860b;
            color: #ffffff;
            font-size: 8px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 30px;
        }
        .custom-wrap .custom-card .picker .opt .right {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .custom-wrap .custom-card .picker .opt .right .original-price {
            font-size: 10px;
            color: #8e8e93;
            text-decoration: line-through;
        }
        .custom-wrap .custom-card .picker .opt .right .final-price {
            font-weight: 700;
            font-size: 12px;
            color: #b8860b;
        }
        .custom-wrap .custom-card .picker .opt .right .qty-btn {
            background: #e8e8ed;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            color: #b8860b;
            position: relative;
            z-index: 5;
        }
        .custom-wrap .custom-card .picker .opt .right .qty-btn:active {
            background: #cdcdd2;
        }
        .custom-wrap .custom-card .picker .opt .right .qty-num {
            min-width: 22px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: #b8860b;
            transition: all 0.2s ease;
        }
        .custom-wrap .custom-card .summary {
            background: #ffffff;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            position: sticky;
            bottom: 0;
            z-index: 5;
            border: 1px solid #eaeaee;
            transition: all 0.3s ease;
        }
        .custom-wrap .custom-card .summary .empty {
            color: #8e8e93;
            font-size: 12px;
        }
        .custom-wrap .custom-card .summary .item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid #eaeaee;
            color: #b8860b;
            font-size: 12px;
            animation: fadeInItem 0.3s ease;
        }
        .custom-wrap .custom-card .summary .item:last-child {
            border-bottom: none;
        }
        .custom-wrap .custom-card .summary .total-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-weight: 600;
            border-top: 1px solid #d2d2d7;
            margin-top: 2px;
            color: #b8860b;
            font-size: 12px;
        }
        .custom-wrap .custom-card .summary .total-row.discount {
            color: #b8860b;
            font-weight: 500;
        }
        .custom-wrap .custom-card .actions {
            display: flex;
            gap: 8px;
        }
        .custom-wrap .custom-card .actions .btn {
            flex: 1;
            padding: 7px 0;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-wrap .custom-card .actions .btn-primary {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff !important;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .custom-wrap .custom-card .actions .btn-primary:hover {
            opacity: 0.85;
        }
        .custom-wrap .custom-card .actions .btn-secondary {
            background: #e8e8ed;
            color: #1d1d1f;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInItem {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* ===== FLOATING WAND - GUNA BG.JPG SEBAGAI TEXT FILL ===== */
        .floating-wand {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 22px;
            display: none;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            transition: none;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            width: 36px;
            height: 36px;
        }
        .floating-wand.show {
            display: flex;
        }
        .floating-wand i {
            font-size: 20px;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ===== SLIDING ANIMATION ===== */
        @keyframes wandSlide {
            0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .floating-wand.sliding {
            animation: wandSlide 0.6s ease forwards;
        }

        /* ===== HEARTBEAT ANIMATION - GUNA BG.JPG ===== */
        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            14% { transform: translate(-50%, -50%) scale(1.3); }
            28% { transform: translate(-50%, -50%) scale(1); }
            42% { transform: translate(-50%, -50%) scale(1.2); }
            56% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .floating-wand.beating {
            animation: heartbeat 0.5s ease-in-out infinite;
        }

        /* ===== GLOW ON BUTTON ===== */
        .qty-btn.pulse-glow {
            animation: btnPulse 0.25s ease 1;
            background: #b8860b !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(184,134,11,0.4);
        }
        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.35); }
        }

        /* ===== QUANTITY BOUNCE ===== */
        .qty-num.bounce-num {
            animation: bounceNum 0.2s ease;
        }
        @keyframes bounceNum {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }

        /* ===== SPARKLE ===== */
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 10px;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: sparkleFly 0.5s ease forwards;
        }
        @keyframes sparkleFly {
            0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(180deg); }
        }

        /* ===== HIGHLIGHT SERVICE ===== */
        .opt.highlight-service {
            border-color: #b8860b !important;
            box-shadow: 0 0 15px rgba(184,134,11,0.1);
            background: rgba(184,134,11,0.04) !important;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .app { padding: 16px 12px 20px; }
            .section-title { font-size: 20px; }
            .custom-wrap { padding: 8px; }
            .custom-wrap .custom-card { padding: 8px 10px; }
            .floating-wand { width: 28px; height: 28px; font-size: 16px; }
            .floating-wand i { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="app">
    <section class="section" id="custom">
        <div class="section-title">
            Package <span class="gold">Customization</span>
            <i class="fas fa-wand-magic-sparkles gold-icon" id="titleWand"></i>
        </div>

        <div class="custom-wrap">
            <div class="custom-card">
                <div class="desc" id="customDesc">Decide your own package, it's all yours. Select services and quantities. <strong>30% OFF for orders RM20+</strong></div>
                <div class="picker" id="customPicker"></div>
                <div class="summary" id="customSummary"><div class="empty">No services selected yet</div></div>
                <div class="actions">
                    <button class="btn btn-secondary" id="clearCustom">Clear All</button>
                    <button class="btn btn-primary" id="addCustomCart">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- ===== FLOATING WAND ===== -->
<div class="floating-wand" id="floatingWand">
    <i class="fas fa-wand-magic-sparkles"></i>
</div>

<script>
    // ===== DATA =====
    const servicesData = [
        { id: 's1', label: '1K Instagram Followers', price: 10.00, discount: 0 },
        { id: 's2', label: '1K Instagram Video Views', price: 1.00, discount: 0 },
        { id: 's3', label: '500 Instagram Story Views', price: 3.00, discount: 0 }
    ];

    let customSelections = {};
    let isAnimating = false;
    let isPaused = false;
    let beatCount = 0;
    let beatInterval = null;
    let currentPhase = 'idle';
    const TOTAL_BEATS = 5;

    const titleWand = document.getElementById('titleWand');
    const floatingWand = document.getElementById('floatingWand');

    // ===== RENDER =====
    function renderCustomPicker() {
        const container = document.getElementById('customPicker');
        container.innerHTML = servicesData.map((item, index) => {
            const qty = customSelections[item.id] || 0;
            const finalPrice = item.discount ? Math.round(item.price * (1 - item.discount / 100) * 100) / 100 : item.price;
            const hasDiscount = item.discount > 0;
            return `
                <div class="opt" data-id="${item.id}" data-index="${index}">
                    <div class="left">
                        <span>${item.label}</span>
                        ${hasDiscount ? `<span class="discount-badge">-${item.discount}%</span>` : ''}
                    </div>
                    <div class="right">
                        ${hasDiscount ? `<span class="original-price">RM${item.price.toFixed(2)}</span>` : ''}
                        <span class="final-price">RM${finalPrice.toFixed(2)}</span>
                        <button class="qty-btn" data-id="${item.id}" data-dir="-1">−</button>
                        <span class="qty-num" id="qtyNum_${item.id}">${qty}</span>
                        <button class="qty-btn plus-btn" data-id="${item.id}" data-dir="1" id="plusBtn_${item.id}">+</button>
                    </div>
                </div>
            `;
        }).join('');

        container.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                const dir = parseInt(this.dataset.dir);
                const current = customSelections[id] || 0;
                const newQty = Math.max(0, current + dir);
                if (newQty === 0) delete customSelections[id];
                else customSelections[id] = newQty;
                renderCustomPicker();
                updateCustomSummary();
                document.querySelectorAll('.opt').forEach(el => el.classList.remove('highlight-service'));
            });
        });
    }

    function updateCustomSummary() {
        const entries = Object.entries(customSelections).filter(([_, q]) => q > 0);
        const container = document.getElementById('customSummary');

        if (entries.length === 0) {
            container.innerHTML = '<div class="empty">No services selected yet</div>';
            return;
        }

        let total = 0;
        let html = '';
        entries.forEach(([id, qty]) => {
            const item = servicesData.find(s => s.id === id);
            if (!item) return;
            const price = item.discount ? Math.round(item.price * (1 - item.discount / 100) * 100) / 100 : item.price;
            const subtotal = price * qty;
            total += subtotal;
            html += `<div class="item"><span>${item.label} x${qty}</span><span>RM${subtotal.toFixed(2)}</span></div>`;
        });

        let discount = 0;
        const minPurchase = 20;
        const discountPercent = 30;
        if (total >= minPurchase && discountPercent > 0) {
            discount = Math.round(total * (discountPercent / 100) * 100) / 100;
        }
        const finalTotal = total - discount;

        html += `<div class="total-row"><span>Subtotal</span><span>RM${total.toFixed(2)}</span></div>`;
        if (discount > 0) {
            html += `<div class="total-row discount"><span>Discount ${discountPercent}%</span><span>-RM${discount.toFixed(2)}</span></div>`;
        }
        html += `<div class="total-row"><span>Total</span><span>RM${finalTotal.toFixed(2)}</span></div>`;
        container.innerHTML = html;
    }

    // ===== POSITIONS =====
    function getPlusButtonPosition() {
        const btn = document.querySelector('.opt[data-index="0"] .plus-btn');
        if (!btn) return null;
        const rect = btn.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    function getTitleWandPosition() {
        const rect = titleWand.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    // ===== SPARKLES =====
    function createSparkles(x, y, count = 8) {
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'sparkle-particle';
            const symbols = ['✦', '✧', '✦', '✧', '✦', '✧', '✦', '✧'];
            el.textContent = symbols[i % symbols.length];
            const angle = (i / count) * Math.PI * 2 + Math.random() * 0.2;
            const distance = 20 + Math.random() * 35;
            el.style.left = (x + (Math.random() - 0.5) * 6) + 'px';
            el.style.top = (y + (Math.random() - 0.5) * 6) + 'px';
            el.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            el.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            el.style.fontSize = (8 + Math.random() * 10) + 'px';
            document.body.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 600);
        }
    }

    // ===== ADD TO PACKAGE =====
    function addToPackage() {
        const current = customSelections['s1'] || 0;
        customSelections['s1'] = current + 1;
        renderCustomPicker();
        updateCustomSummary();

        const qtyEl = document.getElementById('qtyNum_s1');
        if (qtyEl) {
            qtyEl.classList.remove('bounce-num');
            void qtyEl.offsetWidth;
            qtyEl.classList.add('bounce-num');
        }

        const btn = document.querySelector('.plus-btn[data-id="s1"]');
        if (btn) {
            btn.classList.remove('pulse-glow');
            void btn.offsetWidth;
            btn.classList.add('pulse-glow');
            setTimeout(() => btn.classList.remove('pulse-glow'), 400);
        }
    }

    // ===== ANIMATION PHASES =====

    // Phase 1: Slide wand from title to + button
    function slideWandToButton(callback) {
        const targetPos = getPlusButtonPosition();
        if (!targetPos) { if (callback) callback(); return; }

        titleWand.classList.add('wand-hidden');
        titleWand.classList.remove('wand-visible');

        const opt = document.querySelector('.opt[data-index="0"]');
        if (opt) opt.classList.add('highlight-service');

        floatingWand.style.left = targetPos.x + 'px';
        floatingWand.style.top = targetPos.y + 'px';
        floatingWand.className = 'floating-wand show sliding';
        floatingWand.style.display = 'flex';

        setTimeout(() => {
            createSparkles(targetPos.x, targetPos.y, 12);
        }, 300);

        setTimeout(() => {
            floatingWand.className = 'floating-wand show';
            floatingWand.style.animation = 'none';
            if (callback) callback();
        }, 700);
    }

    // Phase 2: Wait at button (diam)
    function waitAtButton(callback) {
        floatingWand.className = 'floating-wand show';
        const pos = getPlusButtonPosition();
        if (pos) createSparkles(pos.x, pos.y, 4);
        setTimeout(() => {
            if (callback) callback();
        }, 1200);
    }

    // Phase 3: Heartbeat (degupan) - tekan + 5 kali
    function startHeartbeat(callback) {
        beatCount = 0;
        floatingWand.className = 'floating-wand show beating';

        const pos = getPlusButtonPosition();
        if (pos) createSparkles(pos.x, pos.y, 10);

        beatInterval = setInterval(() => {
            beatCount++;
            addToPackage();

            const btnPos = getPlusButtonPosition();
            if (btnPos) createSparkles(btnPos.x, btnPos.y, 6);

            floatingWand.className = 'floating-wand show beating';
            floatingWand.style.animation = 'none';
            void floatingWand.offsetWidth;
            floatingWand.className = 'floating-wand show beating';

            if (beatCount >= TOTAL_BEATS) {
                clearInterval(beatInterval);
                beatInterval = null;
                floatingWand.className = 'floating-wand show';
                const finalPos = getPlusButtonPosition();
                if (finalPos) createSparkles(finalPos.x, finalPos.y, 14);
                if (callback) callback();
            }
        }, 380);
    }

    // Phase 4: Return wand to title
    function returnWandToTitle(callback) {
        const titlePos = getTitleWandPosition();
        if (!titlePos) { if (callback) callback(); return; }

        floatingWand.style.left = titlePos.x + 'px';
        floatingWand.style.top = titlePos.y + 'px';
        floatingWand.className = 'floating-wand show';
        floatingWand.style.animation = 'none';

        createSparkles(titlePos.x, titlePos.y, 10);

        const opt = document.querySelector('.opt[data-index="0"]');
        if (opt) opt.classList.remove('highlight-service');

        setTimeout(() => {
            floatingWand.className = 'floating-wand';
            floatingWand.style.display = 'none';
            titleWand.classList.remove('wand-hidden');
            titleWand.classList.add('wand-visible');
            if (callback) callback();
        }, 500);
    }

    // ===== MAIN LOOP =====
    function runAnimationLoop() {
        if (isPaused) return;

        currentPhase = 'sliding';
        slideWandToButton(() => {
            if (isPaused) return;
            currentPhase = 'waiting';
            waitAtButton(() => {
                if (isPaused) return;
                currentPhase = 'beating';
                startHeartbeat(() => {
                    if (isPaused) return;
                    currentPhase = 'returning';
                    returnWandToTitle(() => {
                        if (isPaused) return;
                        currentPhase = 'idle';
                        setTimeout(() => {
                            if (!isPaused) runAnimationLoop();
                        }, 800);
                    });
                });
            });
        });
    }

    // ===== START / PAUSE =====
    function startAnimation() {
        if (isAnimating) return;
        isAnimating = true;
        isPaused = false;

        customSelections = {};
        renderCustomPicker();
        updateCustomSummary();
        beatCount = 0;
        if (beatInterval) {
            clearInterval(beatInterval);
            beatInterval = null;
        }

        titleWand.classList.add('wand-hidden');
        titleWand.classList.remove('wand-visible');

        setTimeout(() => {
            runAnimationLoop();
        }, 500);
    }

    function togglePause() {
        if (!isAnimating) {
            startAnimation();
            return;
        }

        isPaused = !isPaused;

        if (isPaused) {
            if (beatInterval) {
                clearInterval(beatInterval);
                beatInterval = null;
            }
            floatingWand.className = 'floating-wand';
            floatingWand.style.display = 'none';
            titleWand.classList.remove('wand-hidden');
            titleWand.classList.add('wand-visible');
            document.querySelectorAll('.opt').forEach(el => el.classList.remove('highlight-service'));
        } else {
            titleWand.classList.add('wand-hidden');
            titleWand.classList.remove('wand-visible');
            if (currentPhase === 'idle' || currentPhase === 'returning') {
                runAnimationLoop();
            } else if (currentPhase === 'sliding') {
                slideWandToButton(() => {
                    if (!isPaused) {
                        currentPhase = 'waiting';
                        waitAtButton(() => {
                            if (!isPaused) {
                                currentPhase = 'beating';
                                startHeartbeat(() => {
                                    if (!isPaused) {
                                        currentPhase = 'returning';
                                        returnWandToTitle(() => {
                                            if (!isPaused) {
                                                currentPhase = 'idle';
                                                setTimeout(() => {
                                                    if (!isPaused) runAnimationLoop();
                                                }, 800);
                                            }
                                        });
                                    }
                                });
                            }
                        });
                    }
                });
            } else if (currentPhase === 'waiting') {
                waitAtButton(() => {
                    if (!isPaused) {
                        currentPhase = 'beating';
                        startHeartbeat(() => {
                            if (!isPaused) {
                                currentPhase = 'returning';
                                returnWandToTitle(() => {
                                    if (!isPaused) {
                                        currentPhase = 'idle';
                                        setTimeout(() => {
                                            if (!isPaused) runAnimationLoop();
                                        }, 800);
                                    }
                                });
                            }
                        });
                    }
                });
            } else if (currentPhase === 'beating') {
                startHeartbeat(() => {
                    if (!isPaused) {
                        currentPhase = 'returning';
                        returnWandToTitle(() => {
                            if (!isPaused) {
                                currentPhase = 'idle';
                                setTimeout(() => {
                                    if (!isPaused) runAnimationLoop();
                                }, 800);
                            }
                        });
                    }
                });
            }
        }
    }

    function resetAnimation() {
        isPaused = true;
        isAnimating = false;
        if (beatInterval) {
            clearInterval(beatInterval);
            beatInterval = null;
        }
        floatingWand.className = 'floating-wand';
        floatingWand.style.display = 'none';
        titleWand.classList.remove('wand-hidden');
        titleWand.classList.add('wand-visible');
        document.querySelectorAll('.opt').forEach(el => el.classList.remove('highlight-service'));
        customSelections = {};
        renderCustomPicker();
        updateCustomSummary();
        currentPhase = 'idle';
        beatCount = 0;

        setTimeout(() => {
            startAnimation();
        }, 500);
    }

    // ===== EVENTS =====
    titleWand.addEventListener('click', function(e) {
        e.stopPropagation();
        togglePause();
    });

    document.getElementById('clearCustom').addEventListener('click', function() {
        resetAnimation();
    });

    document.getElementById('addCustomCart').addEventListener('click', function() {
        const entries = Object.entries(customSelections).filter(([_, q]) => q > 0);
        if (entries.length === 0) {
            alert('No services selected');
            return;
        }
        alert('Package added to cart! 🎉');
        if (!isPaused) {
            customSelections = {};
            renderCustomPicker();
            updateCustomSummary();
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'd' || e.key === 'D') {
            document.body.classList.toggle('dark-mode');
        }
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            togglePause();
        }
    });

    // ===== INIT =====
    renderCustomPicker();
    updateCustomSummary();

    setTimeout(() => {
        startAnimation();
    }, 1000);

    console.log('✅ Custom Package Animation');
    console.log('✅ Wand slides to + button of 1K Instagram Followers');
    console.log('✅ Heartbeat 5 times (adds to package)');
    console.log('✅ Returns to title and repeats');
    console.log('✅ Click wand or SPACE to pause/resume');
    console.log('✅ 30% OFF for RM20+');
</script>

</body>
</html>
