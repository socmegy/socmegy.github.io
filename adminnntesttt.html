<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Socmegy · Admin</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== HIDE ALL SCROLLBARS ===== */
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        body { overflow-y: scroll; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        /* ===== SPLASH ===== */
        #splashScreen {
            position: fixed; inset: 0; background-image: url('bg.jpg'); background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.6s ease;
        }
        #splashScreen.hide { opacity: 0; pointer-events: none; }
        #splashScreen img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; animation: splashPulse 1.2s ease-in-out infinite; }
        @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }

        /* ===== LOGIN ===== */
        #loginPage { display: none; min-height: 100vh; background-image: url('bg.jpg'); background-size: cover; background-position: center; }
        .login-wrap { display: flex; min-height: 100vh; width: 100%; }
        .login-left { flex: 1.2; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; }
        .login-left .app-logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.3); }
        .login-left h1 { font-size: 44px; font-weight: 700; color: #ffffff; margin-top: 12px; letter-spacing: -1px; text-shadow: 0 2px 12px rgba(0,0,0,0.15); }
        .login-right { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 56px; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .login-right h2 { font-size: 28px; font-weight: 700; color: #1d1d1f; margin-bottom: 4px; }
        .login-right .sub { color: #6e6e73; font-size: 14px; margin-bottom: 24px; }
        .login-right .form-group { margin-bottom: 14px; }
        .login-right .form-group label { display: block; font-size: 13px; font-weight: 600; color: #b8860b; margin-bottom: 4px; }
        .login-right .form-group input { width: 100%; padding: 14px 16px; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; font-size: 15px; background: #f8f8fa; transition: border 0.2s; }
        .login-right .form-group input:focus { outline: none; border-color: #b8860b; }
        .login-right .login-btn { width: 100%; padding: 14px; background-image: url('bg.jpg'); background-size: cover; background-position: center; color: #ffffff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
        .login-right .login-btn:hover { opacity: 0.85; }
        .login-right .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; display: none; }

        @media (max-width: 768px) {
            #loginPage { background-image: url('bg.jpg') !important; background-size: cover !important; background-position: center !important; min-height: 100vh; }
            .login-wrap { flex-direction: column; justify-content: flex-end; min-height: 100vh; width: 100%; }
            .login-left { padding: 16px 16px 12px; flex: none; background: none; min-height: auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .login-left .app-logo { width: 76px; height: 76px; border: 3px solid rgba(255,255,255,0.2); margin-bottom: 4px; }
            .login-left h1 { font-size: 26px; color: #ffffff; text-shadow: 0 2px 16px rgba(0,0,0,0.35); margin-top: 2px; margin-bottom: 10px; }
            .login-right { padding: 18px 18px 26px; flex: none; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px 20px 0 0; width: 100%; margin: 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.04); }
            .login-right .handle { width: 40px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 4px; margin: 0 auto 14px; }
            .login-right h2 { font-size: 22px; text-align: center; }
            .login-right .sub { text-align: center; }
        }
        @media (max-width: 480px) {
            .login-left .app-logo { width: 64px; height: 64px; }
            .login-left h1 { font-size: 22px; }
            .login-right { padding: 16px 14px 22px; }
            .login-right h2 { font-size: 20px; }
            .login-right .form-group input { padding: 12px 14px; font-size: 14px; }
            .login-right .login-btn { padding: 12px; font-size: 15px; }
        }

        /* ===== ADMIN APP ===== */
        #adminApp { display: none; min-height: 100vh; }

        .admin-topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0,0,0,0.04); padding: 0 28px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .admin-topbar .brand { display: flex; align-items: center; gap: 10px; }
        .admin-topbar .brand img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .admin-topbar .brand span { font-size: 18px; font-weight: 700; color: #b8860b; }
        .admin-topbar .topbar-right { display: flex; align-items: center; gap: 12px; }
        .admin-topbar .topbar-right .user-badge { font-size: 13px; color: #6e6e73; }
        .admin-topbar .topbar-right .logout-btn { background-image: url('bg.jpg'); background-size: cover; background-position: center; border: none; padding: 6px 14px; border-radius: 30px; font-size: 13px; font-weight: 600; color: #ffffff; cursor: pointer; transition: opacity 0.2s; text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
        .admin-topbar .topbar-right .logout-btn:hover { opacity: 0.85; }

        .admin-sidebar {
            position: fixed; top: 60px; left: 0; bottom: 0; width: 220px;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(0,0,0,0.04); padding: 12px 10px; overflow-y: auto; z-index: 90;
            transition: transform 0.3s ease;
        }
        .admin-sidebar .nav-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 500;
            color: #6e6e73; cursor: pointer; transition: all 0.2s; border: none;
            background: none; width: 100%; text-align: left; font-family: inherit; margin-bottom: 1px;
        }
        .admin-sidebar .nav-item:hover { background: rgba(0,0,0,0.04); color: #1d1d1f; }
        .admin-sidebar .nav-item.active { background-image: url('bg.jpg'); background-size: cover; background-position: center; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.15); }
        .admin-sidebar .nav-item .badge { font-size: 11px; font-weight: 600; background: rgba(0,0,0,0.06); padding: 0 10px; border-radius: 30px; color: #6e6e73; min-width: 24px; text-align: center; }
        .admin-sidebar .nav-item.active .badge { background: rgba(255,255,255,0.2); color: #ffffff; }
        .admin-sidebar .sidebar-divider { height: 1px; background: rgba(0,0,0,0.04); margin: 6px 12px; }
        .admin-sidebar .sidebar-label { font-size: 10px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 14px 2px; }

        .admin-main { margin-left: 220px; margin-top: 60px; padding: 24px 28px 48px; min-height: calc(100vh - 60px); }

        .admin-card { background: #ffffff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.04); padding: 18px 22px; margin-bottom: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
        .admin-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
        .admin-card .card-header h3 { font-size: 17px; font-weight: 700; color: #1d1d1f; }
        .admin-card .card-header .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .admin-card .card-header .count-badge { font-size: 12px; color: #8e8e93; background: rgba(0,0,0,0.04); padding: 2px 12px; border-radius: 30px; }

        .btn {
            padding: 8px 18px; border: none; border-radius: 30px; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
            font-family: inherit; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .btn-primary { background-image: url('bg.jpg'); background-size: cover; background-position: center; color: #ffffff; }
        .btn-primary:hover { opacity: 0.85; }
        .btn-secondary { background: rgba(0,0,0,0.04); color: #1d1d1f; text-shadow: none; }
        .btn-secondary:hover { background: rgba(0,0,0,0.08); }
        .btn-success { background-image: url('bg.jpg'); background-size: cover; background-position: center; color: #ffffff; }
        .btn-success:hover { opacity: 0.85; }
        .btn-danger { background-image: url('bg.jpg'); background-size: cover; background-position: center; color: #ffffff; }
        .btn-danger:hover { opacity: 0.85; }
        .btn-sm { padding: 4px 12px; font-size: 11px; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.04); gap: 10px; }
        .list-item:last-child { border-bottom: none; }
        .list-item .item-main { flex: 1; min-width: 0; }
        .list-item .item-main .title { font-weight: 600; font-size: 14px; color: #1d1d1f; }
        .list-item .item-main .sub { font-size: 12px; color: #6e6e73; margin-top: 1px; }
        .list-item .item-main .meta { font-size: 11px; color: #8e8e93; margin-top: 2px; }
        .list-item .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .list-item .item-actions button { background: rgba(0,0,0,0.04); border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 13px; cursor: pointer; transition: all 0.2s; color: #6e6e73; display: flex; align-items: center; justify-content: center; }
        .list-item .item-actions button:hover { background: rgba(0,0,0,0.08); }
        .list-item .item-actions .edit-btn { background: rgba(184,134,11,0.12); color: #b8860b; font-weight: 600; }
        .list-item .item-actions .edit-btn:hover { background: rgba(184,134,11,0.25); }
        .list-item .item-actions .delete-btn { background: rgba(231,76,60,0.12); color: #e74c3c; font-weight: 600; }
        .list-item .item-actions .delete-btn:hover { background: rgba(231,76,60,0.25); }

        .empty-state { text-align: center; padding: 36px 16px; color: #8e8e93; }
        .empty-state .empty-icon { font-size: 32px; opacity: 0.2; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #b8860b; margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px;
            font-size: 14px; font-family: inherit; background: #f8f8fa; transition: border 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #b8860b; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Checkbox toggle */
        .toggle-wrap { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
        .toggle-wrap input[type="checkbox"] { width: 18px; height: 18px; accent-color: #b8860b; cursor: pointer; }
        .toggle-wrap label { font-size: 13px; font-weight: 500; color: #1d1d1f; cursor: pointer; }

        /* Preview image */
        .img-preview { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 6px; border: 1px solid rgba(0,0,0,0.06); display: none; }

        /* Popup type selector */
        .popup-type-selector { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .popup-type-selector button {
            padding: 8px 20px; border-radius: 30px; border: 2px solid rgba(0,0,0,0.06);
            background: #f8f8fa; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: 0.2s; color: #6e6e73; font-family: inherit;
        }
        .popup-type-selector button.active { border-color: #b8860b; background: rgba(184,134,11,0.08); color: #b8860b; }
        .popup-type-selector button:hover:not(.active) { background: rgba(0,0,0,0.03); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: flex-end;
            z-index: 9998; pointer-events: none;
        }
        .modal-overlay.open { display: flex; pointer-events: auto; }
        .modal-box {
            background: #ffffff; border-radius: 20px 20px 0 0; padding: 18px 22px 28px;
            max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto;
            animation: slideUp 0.3s ease; position: relative; z-index: 9999;
            pointer-events: auto; isolation: isolate;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-box .modal-handle { width: 40px; height: 4px; background: rgba(0,0,0,0.12); border-radius: 4px; margin: 0 auto 14px; }
        .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-box .modal-header h3 { font-size: 18px; font-weight: 700; color: #1d1d1f; }
        .modal-box .modal-header .close-modal { background: rgba(0,0,0,0.04); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; color: #8e8e93; display: flex; align-items: center; justify-content: center; }
        .modal-box .modal-header .close-modal:hover { background: rgba(0,0,0,0.08); }
        .modal-box .form-actions { display: flex; gap: 10px; margin-top: 14px; }
        .modal-box .form-actions .btn { flex: 1; justify-content: center; padding: 12px; font-size: 14px; border-radius: 12px; }

        /* Toast */
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 99999; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .toast .msg { flex: 1; font-size: 14px; font-weight: 500; color: #ffffff; }
        .toast .close-toast { background: none; border: none; font-size: 18px; cursor: pointer; color: rgba(255,255,255,0.4); }
        .toast .close-toast:hover { color: #ffffff; }

        /* Mobile */
        .mobile-hamburger { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: #b8860b; padding: 4px; }
        .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); z-index: 85; }
        .mobile-overlay.open { display: block; }

        .required-star { color: #e74c3c; margin-left: 2px; }

        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); width: 280px; top: 0; padding-top: 60px; background: rgba(255,255,255,0.98); }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding: 14px 14px 80px; margin-top: 60px; }
            .admin-topbar { padding: 0 16px; }
            .mobile-hamburger { display: block; }
            .admin-topbar .topbar-right .user-badge { display: none; }
            .admin-card { padding: 14px; }
            .modal-box { padding: 14px 16px 20px; max-width: 100%; border-radius: 20px 20px 0 0; }
            .form-row { grid-template-columns: 1fr; }
            .popup-type-selector { flex-wrap: wrap; }
            .popup-type-selector button { flex: 1; min-width: 100px; text-align: center; }
        }
        @media (max-width: 480px) {
            .admin-main { padding: 10px 10px 80px; }
            .admin-card { padding: 10px; }
            .btn { font-size: 12px; padding: 6px 14px; }
            .modal-box { padding: 12px 12px 18px; }
            .popup-type-selector button { font-size: 12px; padding: 6px 14px; }
            .toggle-wrap label { font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splashScreen"><img src="logo.png" alt="Socmegy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23b8860b%22 width=%22100%22 height=%22100%22 rx=%2250%22/%3E%3Ctext x=%2250%22 y=%2264%22 text-anchor=%22middle%22 font-family=%22system-ui%22 font-size=%2244%22 fill=%22%23fff%22 font-weight=%22700%22%3ES%3C/text%3E%3C/svg%3E'" /></div>

<!-- ===== LOGIN ===== -->
<div id="loginPage">
    <div class="login-wrap">
        <div class="login-left">
            <img src="logo.png" alt="Socmegy" class="app-logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22%3E%3Crect fill=%22%23b8860b%22 width=%22120%22 height=%22120%22 rx=%2260%22/%3E%3Ctext x=%2260%22 y=%2276%22 text-anchor=%22middle%22 font-family=%22system-ui%22 font-size=%2252%22 fill=%22%23fff%22 font-weight=%22700%22%3ES%3C/text%3E%3C/svg%3E'" />
            <h1>Socmegy</h1>
        </div>
        <div class="login-right">
            <div class="handle"></div>
            <h2>Welcome Back</h2>
            <div class="sub">Sign in to your account</div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" />
                </div>
                <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                <div class="login-error" id="loginError">Invalid email or password</div>
            </form>
        </div>
    </div>
</div>

<!-- ===== ADMIN APP ===== -->
<div id="adminApp">

    <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="mobile-hamburger" id="hamburgerBtn">☰</button>
            <div class="brand">
                <img src="logo.png" alt="Socmegy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22%3E%3Crect fill=%22%23b8860b%22 width=%2232%22 height=%2232%22 rx=%2216%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 font-family=%22system-ui%22 font-size=%2216%22 fill=%22%23fff%22 font-weight=%22700%22%3ES%3C/text%3E%3C/svg%3E'" />
                <span>Dashboard</span>
            </div>
        </div>
        <div class="topbar-right">
            <span class="user-badge" id="userEmail"></span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </header>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <nav class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-label">Dashboard</div>
        <button class="nav-item active" data-tab="dashboard">Analytics</button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Management</div>
        <button class="nav-item" data-tab="services">Services <span class="badge" id="serviceCount">0</span></button>
        <button class="nav-item" data-tab="categories">Categories <span class="badge" id="categoryCount">0</span></button>
        <button class="nav-item" data-tab="reviews">Reviews <span class="badge" id="reviewCount">0</span></button>
        <button class="nav-item" data-tab="results">Results <span class="badge" id="resultCount">0</span></button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Orders</div>
        <button class="nav-item" data-tab="orders">Orders <span class="badge" id="orderCount">0</span></button>
        <button class="nav-item" data-tab="customers">Customers <span class="badge" id="customerCount">0</span></button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Content</div>
        <button class="nav-item" data-tab="announcements">Announcements <span class="badge" id="announceCount">0</span></button>
        <button class="nav-item" data-tab="popup">Popup Builder</button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Settings</div>
        <button class="nav-item" data-tab="customization">Customization</button>
        <button class="nav-item" data-tab="read">Please Read</button>
    </nav>

    <main class="admin-main" id="adminContent"></main>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <h3 id="modalTitle">Add</h3>
            <button type="button" class="close-modal" id="modalCloseBtn">✕</button>
        </div>
        <form id="modalForm">
            <div id="modalBody"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toastContainer">
    <div class="toast" id="toast">
        <span class="msg" id="toastMsg">Saved</span>
        <button class="close-toast" id="toastCloseBtn">✕</button>
    </div>
</div>

        const data = new TextEncoder().encode(`${phone}:${pin}`);

                    <span class="label" style="font-weight:500;font-size:14px;color:#1d1d1f;">Minimum Purchase</span>
                    <input type="number" id="setMinPurchase" min="0" step="0.5" value="${settings.minPurchase || 10}" style="width:100px;padding:8px 12px;border:1px solid rgba(0,0,0,0.06);border-radius:10px;font-size:14px;text-align:center;background:#f8f8fa;" />
                    <span class="desc" style="font-size:12px;color:#8e8e93;flex:1;min-width:100px;">RM minimum to qualify for discount</span>
                </div>
                <div style="margin-top:16px;"><button class="btn btn-primary" id="saveCustomBtn">Save Settings</button></div>
            </div>
        `;
        document.getElementById('saveCustomBtn')?.addEventListener('click', function() {
            const discount = parseFloat(document.getElementById('setDiscount').value) || 0;
            const minPurchase = parseFloat(document.getElementById('setMinPurchase').value) || 0;
            db.ref('settings').set({ discountPercent: discount, minPurchase: minPurchase }).then(()=>showToast('Saved')).catch(()=>showToast('Error'));
        });
    }

    // ============================================================
    // READ (simplified)
    // ============================================================

        c.innerHTML = `
            <div class="admin-card"><div class="card-header"><h3>Please Read Content</h3></div>
                <div class="form-group"><label style="display:block;font-size:13px;font-weight:600;color:#b8860b;margin-bottom:4px;">Content (HTML supported)</label>
                <textarea id="readContent" style="width:100%;padding:12px;border:1px solid rgba(0,0,0,0.06);border-radius:12px;font-size:14px;font-family:inherit;background:#f8f8fa;min-height:300px;resize:vertical;">${readContent}</textarea></div>

    // ============================================================
    // POPUP BUILDER
    // ============================================================
    function renderPopup(c) {
        let html = `
            <div class="admin-card">
                <div class="card-header"><h3>Popup Builder</h3></div>
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;font-weight:600;color:#b8860b;margin-bottom:6px;">Popup Type</label>
                    <div class="popup-type-selector">
                        <button class="active" data-type="text" onclick="setPopupType('text')">Text Only</button>
                        <button data-type="image" onclick="setPopupType('image')">Image Only</button>
                    </div>
                </div>
                <div id="popupFormFields">
                    <!-- Rendered by JS -->
                </div>
                <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-primary" id="savePopupBtn">Save Popup Settings</button>
                    <button class="btn btn-success" id="previewPopupBtn">Preview Popup</button>
                </div>
                <div style="margin-top:12px;padding:12px;background:#f8f8fa;border-radius:12px;font-size:13px;color:#6e6e73;">
                    <strong>Glass Setting:</strong> Blur 0px · Alpha 0.20 · Saturation 1.5
                    <span style="display:inline-block;margin-left:12px;padding:2px 12px;background:rgba(184,134,11,0.08);border-radius:30px;color:#b8860b;font-weight:600;">LOCKED</span>
                </div>
            </div>
        `;
        c.innerHTML = html;

        // Load saved popup data
        db.ref('popup').once('value').then(snap => {
            const data = snap.val() || {};
            popupData = { type: data.type || 'text', title: data.title || '', desc: data.desc || '', icon: data.icon || '',
                buttonEnabled: data.buttonEnabled || false, buttonText: data.buttonText || '', buttonLink: data.buttonLink || '',
                image: data.image || '' };
            renderPopupFields();
        });

        document.getElementById('savePopupBtn')?.addEventListener('click', savePopup);
        document.getElementById('previewPopupBtn')?.addEventListener('click', previewPopup);
    }

    function setPopupType(type) {
        popupData.type = type;
        document.querySelectorAll('.popup-type-selector button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
        renderPopupFields();
    }

    function renderPopupFields() {
        const container = document.getElementById('popupFormFields');
        const d = popupData;

        if (d.type === 'text') {
            container.innerHTML = `
                <div class="form-group">
                    <label>Title <span class="required-star">*</span></label>
                    <input type="text" id="popupTitle" value="${escapeHtml(d.title)}" placeholder="e.g. Limited Time Offer" required />
                </div>
                <div class="form-group">
                    <label>Description <span class="required-star">*</span></label>
                    <textarea id="popupDesc" rows="2" placeholder="e.g. Get 20% off on all services">${escapeHtml(d.desc)}</textarea>
                </div>
                <div class="form-group">
                    <label>Icon (optional)</label>
                    <input type="text" id="popupIcon" value="${escapeHtml(d.icon)}" placeholder="e.g. fa-regular fa-bell" />
                    <div style="font-size:11px;color:#8e8e93;margin-top:2px;">Font Awesome class, e.g. fa-regular fa-gem</div>
                </div>
                <div style="border-top:1px solid rgba(0,0,0,0.04);padding-top:12px;margin:6px 0 10px;">
                    <div class="toggle-wrap">
                        <input type="checkbox" id="popupBtnEnable" ${d.buttonEnabled ? 'checked' : ''} />
                        <label for="popupBtnEnable">Enable Button</label>
                    </div>
                    <div id="textBtnFields" style="${d.buttonEnabled ? '' : 'opacity:0.4;pointer-events:none;'}">
                        <div class="form-group"><label>Button Text</label><input type="text" id="popupBtnText" value="${escapeHtml(d.buttonText)}" placeholder="e.g. Shop Now" /></div>
                        <div class="form-group"><label>Button Link</label>
                            <input type="text" id="popupBtnLink" value="${escapeHtml(d.buttonLink)}" placeholder="e.g. https://example.com or #services" />
                            <div style="font-size:11px;color:#8e8e93;margin-top:2px;">Boleh guna link dalaman macam #services, #contact, atau external link</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('popupBtnEnable')?.addEventListener('change', function() {
                const fields = document.getElementById('textBtnFields');
                if (this.checked) { fields.style.opacity = '1'; fields.style.pointerEvents = 'auto'; }
                else { fields.style.opacity = '0.4'; fields.style.pointerEvents = 'none'; }
            });
        } else {
            // Image Only
            container.innerHTML = `
                <div class="form-group">
                    <label>Image URL <span class="required-star">*</span></label>
                    <input type="text" id="popupImage" value="${escapeHtml(d.image)}" placeholder="e.g. https://example.com/image.jpg or /images/promo.png" oninput="previewPopupImage(this.value)" />
                    <div style="font-size:11px;color:#8e8e93;margin-top:2px;">Boleh guna link dalaman macam /images/promo.png</div>
                    <img id="popupImagePreview" class="img-preview" src="${d.image}" alt="Preview" style="${d.image ? 'display:block;' : ''}" />
                </div>
                <div style="border-top:1px solid rgba(0,0,0,0.04);padding-top:12px;margin:6px 0 10px;">
                    <div class="toggle-wrap">
                        <input type="checkbox" id="popupBtnEnableImg" ${d.buttonEnabled ? 'checked' : ''} />
                        <label for="popupBtnEnableImg">Enable Button</label>
                    </div>
                    <div id="imgBtnFields" style="${d.buttonEnabled ? '' : 'opacity:0.4;pointer-events:none;'}">
                        <div class="form-group"><label>Button Text</label><input type="text" id="popupBtnTextImg" value="${escapeHtml(d.buttonText)}" placeholder="e.g. View Details" /></div>
                        <div class="form-group"><label>Button Link</label>
                            <input type="text" id="popupBtnLinkImg" value="${escapeHtml(d.buttonLink)}" placeholder="e.g. https://example.com or #services" />
                            <div style="font-size:11px;color:#8e8e93;margin-top:2px;">Boleh guna link dalaman macam #services, #contact, atau external link</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('popupBtnEnableImg')?.addEventListener('change', function() {
                const fields = document.getElementById('imgBtnFields');
                if (this.checked) { fields.style.opacity = '1'; fields.style.pointerEvents = 'auto'; }
                else { fields.style.opacity = '0.4'; fields.style.pointerEvents = 'none'; }
            });
            window.previewPopupImage = function(url) {
                const preview = document.getElementById('popupImagePreview');
                if (url && url.trim()) { preview.src = url.trim(); preview.style.display = 'block'; }
                else { preview.style.display = 'none'; }
            };
        }
    }

    function savePopup() {
        const d = popupData;
        let data = { type: d.type };

        if (d.type === 'text') {
            const title = document.getElementById('popupTitle')?.value.trim();
            const desc = document.getElementById('popupDesc')?.value.trim();
            if (!title) { showToast('Title is required'); return; }
            if (!desc) { showToast('Description is required'); return; }
            data.title = title;
            data.desc = desc;
            data.icon = document.getElementById('popupIcon')?.value.trim() || '';
            const btnEnabled = document.getElementById('popupBtnEnable')?.checked || false;
            data.buttonEnabled = btnEnabled;
            data.buttonText = btnEnabled ? document.getElementById('popupBtnText')?.value.trim() || '' : '';
            data.buttonLink = btnEnabled ? document.getElementById('popupBtnLink')?.value.trim() || '' : '';
            data.image = '';
        } else {
            const image = document.getElementById('popupImage')?.value.trim();
            if (!image) { showToast('Image URL is required'); return; }
            data.image = image;
            data.title = '';
            data.desc = '';
            data.icon = '';
            const btnEnabled = document.getElementById('popupBtnEnableImg')?.checked || false;
            data.buttonEnabled = btnEnabled;
            data.buttonText = btnEnabled ? document.getElementById('popupBtnTextImg')?.value.trim() || '' : '';
            data.buttonLink = btnEnabled ? document.getElementById('popupBtnLinkImg')?.value.trim() || '' : '';
        }

        db.ref('popup').set(data).then(() => {
            showToast('Popup settings saved');
            popupData = data;
        }).catch(() => showToast('Error saving'));
    }

    function previewPopup() {
        // Get latest data from form
        const d = popupData;
        let data = { type: d.type };

        if (d.type === 'text') {
            const title = document.getElementById('popupTitle')?.value.trim() || 'Title';
            const desc = document.getElementById('popupDesc')?.value.trim() || 'Description';
            data.title = title;
            data.desc = desc;
            data.icon = document.getElementById('popupIcon')?.value.trim() || '';
            const btnEnabled = document.getElementById('popupBtnEnable')?.checked || false;
            data.buttonEnabled = btnEnabled;
            data.buttonText = btnEnabled ? document.getElementById('popupBtnText')?.value.trim() || 'Button' : '';
            data.buttonLink = btnEnabled ? document.getElementById('popupBtnLink')?.value.trim() || '#' : '';
        } else {
            const image = document.getElementById('popupImage')?.value.trim() || 'https://picsum.photos/seed/preview/500/500';
            data.image = image;
            const btnEnabled = document.getElementById('popupBtnEnableImg')?.checked || false;
            data.buttonEnabled = btnEnabled;
            data.buttonText = btnEnabled ? document.getElementById('popupBtnTextImg')?.value.trim() || 'Button' : '';
            data.buttonLink = btnEnabled ? document.getElementById('popupBtnLinkImg')?.value.trim() || '#' : '';
        }

        // Build preview HTML
        let html = '';
        if (data.type === 'text') {
            const iconHTML = data.icon ? `<span class="modal-icon" style="font-size:44px;color:#b8860b;display:block;margin-bottom:8px;"><i class="${data.icon}"></i></span>` : '';
            const lineHTML = `<div class="modal-line" style="width:50px;height:2px;background:#b8860b;margin:8px auto 12px auto;border-radius:4px;"></div>`;
            const btnHTML = data.buttonEnabled ? `<a href="${data.buttonLink}" target="${data.buttonLink.startsWith('http') ? '_blank' : '_self'}" class="modal-glass-btn" style="display:inline-flex;align-items:center;justify-content:center;padding:12px 32px;background:rgba(255,255,255,0.20);backdrop-filter:blur(0px) saturate(1.5);-webkit-backdrop-filter:blur(0px) saturate(1.5);border:1px solid rgba(255,255,255,0.10);border-radius:60px;font-weight:600;font-size:16px;color:#1d1d1f;text-decoration:none;transition:0.25s;min-width:120px;text-shadow:0 1px 4px rgba(255,255,255,0.1);">${data.buttonText}</a>` : '';
            html = `
                <div style="text-align:center;">
                    ${iconHTML}
                    <div style="font-size:22px;font-weight:700;color:#1d1d1f;margin-bottom:6px;word-wrap:break-word;">${data.title}</div>
                    ${lineHTML}
                    <div style="font-size:15px;color:#4a4a4d;margin-bottom:18px;line-height:1.7;">${data.desc}</div>
                    ${btnHTML}
                </div>
            `;
        } else {
            const btnHTML = data.buttonEnabled ? `<a href="${data.buttonLink}" target="${data.buttonLink.startsWith('http') ? '_blank' : '_self'}" class="img-btn-modal" style="position:absolute;bottom:28px;right:20px;background:rgba(255,255,255,0.20);backdrop-filter:blur(0px) saturate(1.5);-webkit-backdrop-filter:blur(0px) saturate(1.5);border:1px solid rgba(255,255,255,0.10);border-radius:60px;padding:12px 32px;font-weight:600;font-size:16px;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:0.25s;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,0.15);min-width:120px;">${data.buttonText}</a>` : '';
            const closeBtn = `<span style="position:absolute;top:16px;right:18px;background:rgba(255,255,255,0.20);backdrop-filter:blur(0px) saturate(1.5);-webkit-backdrop-filter:blur(0px) saturate(1.5);border:1px solid rgba(255,255,255,0.10);border-radius:40px;color:#fff;font-size:20px;padding:6px 16px;cursor:pointer;line-height:1.6;z-index:20;text-shadow:0 1px 4px rgba(0,0,0,0.15);">✕</span>`;
            html = `
                <div style="position:relative;width:100%;overflow:hidden;background:transparent;border-radius:24px;">
                    <div style="width:100%;aspect-ratio:1/1;background-size:contain;background-repeat:no-repeat;background-position:center;display:block;background-color:transparent;border-radius:24px;border:none;outline:none;background-image:url('${data.image}');"></div>
                    ${closeBtn}
                    ${btnHTML}
                </div>
            `;
        }

        // Show in modal
        const previewBody = `
            <div style="max-width:480px;margin:0 auto;position:relative;">
                ${html}
                <div style="text-align:center;margin-top:14px;font-size:12px;color:#8e8e93;">⬆ Preview · Glass: blur 0px · alpha 0.20 · sat 1.5</div>
            </div>
        `;
        openModal('Popup Preview', previewBody, 'Close');
        document.getElementById('modalSubmitBtn').textContent = 'Close';
        document.getElementById('modalSubmitBtn').onclick = closeModal;
        document.getElementById('modalSubmitBtn').style.background = 'rgba(0,0,0,0.04)';
        document.getElementById('modalSubmitBtn').style.color = '#1d1d1f';
        document.getElementById('modalSubmitBtn').style.textShadow = 'none';
        document.getElementById('modalSubmitBtn').onmouseenter = function() { this.style.background = 'rgba(0,0,0,0.08)'; };
        document.getElementById('modalSubmitBtn').onmouseleave = function() { this.style.background = 'rgba(0,0,0,0.04)'; };
    }

    // ============================================================
    // ATTACH LIST ACTIONS
    // ============================================================
    function attachListActions(c) {
        c.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.dataset.id; const type = this.dataset.type;
                if (type === 'services') editService(id);
                else if (type === 'categories') editCategory(id);
                else if (type === 'reviews') editReview(id);
                else if (type === 'results') editResult(id);
            });
        });
        c.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.dataset.id; const type = this.dataset.type; const name = this.dataset.name || 'item';
                if (type === 'orders') deleteOrder(id);
                else deleteItem(type, id, name);
            });
        });
    }

    function deleteItem(path, id, name) {
        if (path === 'categories' && services.filter(s => s.category === id).length > 0) { showToast('Move services first'); return; }
        if (confirm('Delete "'+name+'"?')) db.ref(path+'/'+id).remove().then(()=>showToast('Deleted')).catch(()=>showToast('Error'));
    }

    // ============================================================
    // MODAL SUBMIT
    // ============================================================
    document.getElementById('modalForm').addEventListener('submit', function(e) {
        e.preventDefault(); e.stopPropagation();
        const type = editingType;
        if (!type) { showToast('Unknown operation'); return; }
        const sb = document.getElementById('modalSubmitBtn');
        sb.disabled = true; sb.textContent = 'Saving...';

        let data = {}, isValid = true;
        try {
            if (type === 'services') {
                const label = document.getElementById('f_label');
                const category = document.getElementById('f_category');
                const price = document.getElementById('f_price');
                if (!label || !label.value.trim()) { showToast('Label is required'); isValid = false; }
                else if (!category || !category.value) { showToast('Category is required'); isValid = false; }
                else if (!price || parseFloat(price.value) <= 0) { showToast('Price must be > 0'); isValid = false; }
                else {
                    data = { label: label.value.trim(), desc: document.getElementById('f_desc').value.trim() || '',
                        category: category.value, price: parseFloat(price.value) || 0,
                        discount: parseInt(document.getElementById('f_discount').value) || 0,
                        unavailable: document.getElementById('f_status').value === 'unavailable',
                        addedDate: document.getElementById('f_date').value || new Date().toISOString().split('T')[0] };
                }
            } else if (type === 'categories') {
                const name = document.getElementById('f_name');
                if (!name || !name.value.trim()) { showToast('Name is required'); isValid = false; }
                else data = { name: name.value.trim() };
            } else if (type === 'reviews') {
                const quote = document.getElementById('f_quote');
                const customer = document.getElementById('f_customer');
                if (!quote || !quote.value.trim()) { showToast('Quote is required'); isValid = false; }
                else if (!customer || !customer.value.trim()) { showToast('Customer is required'); isValid = false; }
                else data = { quote: quote.value.trim(), customer: customer.value.trim(), stars: parseInt(document.getElementById('f_stars').value) || 5 };
            } else if (type === 'results') {
                const image = document.getElementById('f_image');
                const title = document.getElementById('f_title');
                const badge = document.getElementById('f_badge');
                if (!image || !image.value.trim()) { showToast('Image URL is required'); isValid = false; }
                else if (!title || !title.value.trim()) { showToast('Title is required'); isValid = false; }
                else if (!badge || !badge.value) { showToast('Badge is required'); isValid = false; }
                else data = { image: image.value.trim(), title: title.value.trim(), badge: badge.value };
            } else if (type === 'announcements') {
                const text = document.getElementById('f_text');
                if (!text || !text.value.trim()) { showToast('Text is required'); isValid = false; }
                else data = { text: text.value.trim(), active: document.getElementById('f_status').value === 'active', date: getMalaysiaTime() };
            } else { showToast('Unknown type'); isValid = false; }
        } catch(err) { showToast('Error: '+err.message); isValid = false; }

        if (!isValid) { sb.disabled = false; sb.textContent = sb.dataset.originalText || 'Save'; return; }

        const id = document.getElementById('f_id')?.value || generateId();
        db.ref(type + '/' + id).set(data).then(() => { showToast('Saved'); closeModal(); }).catch(err => { showToast('Error: '+err.message); }).finally(() => {
            sb.disabled = false; sb.textContent = sb.dataset.originalText || 'Save';
        });
    });

    // ============================================================
    // FIREBASE LISTENERS
    // ============================================================
    let appInitialized = false;

    function initApp() {
        if (appInitialized) { renderContent(); return; }
        appInitialized = true;

        db.ref('categories').on('value', snap => {
            const data = snap.val() || {};
            categories = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            document.getElementById('categoryCount').textContent = categories.length;
            if (currentTab === 'categories' || currentTab === 'services' || currentTab === 'results' || currentTab === 'dashboard') renderContent();
        });
        db.ref('services').on('value', snap => {
            const data = snap.val() || {};
            services = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            document.getElementById('serviceCount').textContent = services.length;
            if (currentTab === 'services' || currentTab === 'dashboard') renderContent();
        });
        db.ref('reviews').on('value', snap => {
            const data = snap.val() || {};
            reviews = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            document.getElementById('reviewCount').textContent = reviews.length;
            if (currentTab === 'reviews' || currentTab === 'dashboard') renderContent();
        });
        db.ref('results').on('value', snap => {
            const data = snap.val() || {};
            results = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            document.getElementById('resultCount').textContent = results.length;
            if (currentTab === 'results' || currentTab === 'dashboard') renderContent();
        });
        db.ref('orders').on('value', snap => {
            const data = snap.val() || {};
            orders = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            document.getElementById('orderCount').textContent = orders.length;
            if (currentTab === 'orders' || currentTab === 'dashboard') renderContent();
            // Rebuild customers
            const byPhone = new Map();
            orders.forEach(o => {
                const phone = o.customer?.phone?.replace(/[\s\-+()]/g, '');
                if (!phone) return;
                const name = o.customer?.name || o.customerName || o.name || '';
                const existing = byPhone.get(phone);
                if (!existing) byPhone.set(phone, { id: phone, name, phone: o.customer?.phone || phone, updatedAt: o.date || '' });
                else if (!existing.name && name) existing.name = name;
            });
            customers = Array.from(byPhone.values());
            document.getElementById('customerCount').textContent = customers.length;
            if (currentTab === 'customers') renderContent();
        });
        db.ref('announcements').on('value', snap => {
            const data = snap.val() || {};
            announcements = Object.entries(data).map(([id, val]) => ({ id, ...val }));
            document.getElementById('announceCount').textContent = announcements.length;
            if (currentTab === 'announcements') renderContent();
        });
        db.ref('settings').on('value', snap => {
            const data = snap.val() || {};
            settings = { discountPercent: data.discountPercent ?? 10, minPurchase: data.minPurchase ?? 10 };
            if (currentTab === 'customization') renderContent();
        });
        db.ref('read').on('value', snap => {
            readContent = snap.val() || '';
            if (currentTab === 'read') renderContent();
        });

        renderContent();
    }

    console.log('✅ Admin with Popup Builder ready');
    console.log('✅ Text Only: Title & Desc REQUIRED, Icon & Button OPTIONAL');
    console.log('✅ Image Only: Image REQUIRED (boleh link dalaman), Button OPTIONAL');
    console.log('✅ Glass: blur 0px, alpha 0.20, sat 1.5');
</script>
