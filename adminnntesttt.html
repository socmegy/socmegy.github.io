<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Socmegy · Custom Package</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s;
        }

        body.dark-mode {
            background: #1a1a1a;
            color: #e8e8e8;
        }

        .container {
            max-width: 560px;
            width: 100%;
            padding: 20px;
        }

        /* ===== CUSTOM SECTION - SEBIJIK MACAM ASAL ===== */
        .section-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            color: #b8860b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .gold { color: #b8860b; }

        #custom .section-title,
        #custom .section-title .gold,
        #custom .section-title .gold-icon {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #custom .section-title .gold-icon {
            font-size: 22px;
            display: inline-block;
            vertical-align: middle;
            user-select: none;
            -webkit-user-select: none;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            transition: none;
            position: relative;
        }

        /* Wand bergerak - saiz OG 22px */
        #wandMoving {
            position: fixed;
            z-index: 9999;
            font-size: 22px;
            pointer-events: none;
            display: none;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            will-change: left, top;
            transition: none;
        }

        /* Heartbeat effect - hanya bila sampai drop */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.2); }
            56% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        #wandMoving.beating {
            animation: heartbeat 0.5s ease-in-out 1;
        }

        /* ===== ZOOM SUMMARY ===== */
        @keyframes zoomIn {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(184,134,11,0.2); }
            100% { transform: scale(1); }
        }
        .summary.zoom {
            animation: zoomIn 0.8s ease 1;
            border-color: #b8860b !important;
            box-shadow: 0 0 30px rgba(184,134,11,0.15);
        }

        .custom-wrap {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            padding: 16px;
            width: 100%;
        }
        .custom-wrap .custom-card {
            background: #ffffff;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 12px 14px;
            position: relative;
        }
        body.dark-mode .custom-wrap .custom-card {
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .custom-wrap .custom-card .desc {
            font-size: 13px;
            color: #b8860b;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        body.dark-mode .custom-wrap .custom-card .desc {
            color: #d4a017;
        }

        .custom-wrap .custom-card .picker {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .custom-wrap .custom-card .picker .opt {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 4px;
            position: relative;
            border: 1px solid #eaeaee;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .custom-wrap .custom-card .picker .opt .left {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 500;
            color: #b8860b;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .left {
            color: #d4a017;
        }

        .custom-wrap .custom-card .picker .opt .left .discount-badge {
            background: #b8860b;
            color: #ffffff;
            font-size: 8px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 30px;
        }
        .custom-wrap .custom-card .picker .opt .right {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .custom-wrap .custom-card .picker .opt .right .original-price {
            font-size: 10px;
            color: #8e8e93;
            text-decoration: line-through;
        }
        .custom-wrap .custom-card .picker .opt .right .final-price {
            font-weight: 700;
            font-size: 12px;
            color: #b8860b;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .final-price {
            color: #d4a017;
        }

        .custom-wrap .custom-card .picker .opt .right .qty-btn {
            background: #e8e8ed;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            color: #b8860b;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-btn {
            background: #3a3a3a;
            color: #d4a017;
        }
        .custom-wrap .custom-card .picker .opt .right .qty-btn:active {
            background: #cdcdd2;
        }

        .custom-wrap .custom-card .picker .opt .right .qty-num {
            min-width: 22px;
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: #b8860b;
            transition: all 0.2s ease;
        }
        body.dark-mode .custom-wrap .custom-card .picker .opt .right .qty-num {
            color: #d4a017;
        }

        .custom-wrap .custom-card .summary {
            background: #ffffff;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            position: sticky;
            bottom: 0;
            z-index: 5;
            border: 1px solid #eaeaee;
            transition: all 0.3s ease;
        }
        body.dark-mode .custom-wrap .custom-card .summary {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .custom-wrap .custom-card .summary .empty {
            color: #8e8e93;
            font-size: 12px;
        }
        .custom-wrap .custom-card .summary .item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid #eaeaee;
            color: #b8860b;
            font-size: 12px;
            animation: fadeInItem 0.3s ease;
        }
        body.dark-mode .custom-wrap .custom-card .summary .item {
            color: #d4a017;
            border-bottom-color: rgba(255,255,255,0.05);
        }
        .custom-wrap .custom-card .summary .item:last-child {
            border-bottom: none;
        }
        .custom-wrap .custom-card .summary .total-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-weight: 600;
            border-top: 1px solid #d2d2d7;
            margin-top: 2px;
            color: #b8860b;
            font-size: 12px;
        }
        body.dark-mode .custom-wrap .custom-card .summary .total-row {
            color: #d4a017;
            border-top-color: rgba(255,255,255,0.1);
        }
        .custom-wrap .custom-card .summary .total-row.discount {
            color: #b8860b;
            font-weight: 500;
        }

        .custom-wrap .custom-card .actions {
            display: flex;
            gap: 8px;
        }
        .custom-wrap .custom-card .actions .btn {
            flex: 1;
            padding: 7px 0;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .custom-wrap .custom-card .actions .btn-primary {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            color: #ffffff !important;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        .custom-wrap .custom-card .actions .btn-primary:hover {
            opacity: 0.85;
        }
        .custom-wrap .custom-card .actions .btn-secondary {
            background: #e8e8ed;
            color: #1d1d1f;
        }
        body.dark-mode .custom-wrap .custom-card .actions .btn-secondary {
            background: #3a3a3a;
            color: #d4a017;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInItem {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .qty-btn.pulse-glow {
            animation: btnPulse 0.25s ease 1;
            background: #b8860b !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(184,134,11,0.4);
        }
        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.35); }
        }

        .qty-num.bounce-num {
            animation: bounceNum 0.2s ease;
        }
        @keyframes bounceNum {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }

        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 10px;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: sparkleFly 0.5s ease forwards;
        }
        @keyframes sparkleFly {
            0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(180deg); }
        }

        /* ===== TOGGLE DARK MODE ===== */
        .dark-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.04);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: #b8860b;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .dark-toggle:hover { background: rgba(0,0,0,0.08); }
        body.dark-mode .dark-toggle { background: rgba(255,255,255,0.08); }
        body.dark-mode .dark-toggle:hover { background: rgba(255,255,255,0.15); }

        @media (max-width: 480px) {
            .container { padding: 10px; }
            .section-title { font-size: 20px; }
            .custom-wrap { padding: 8px; }
            .custom-wrap .custom-card { padding: 8px 10px; }
            .custom-wrap .custom-card .picker .opt { padding: 4px 8px; }
            .custom-wrap .custom-card .summary { max-height: 90px; padding: 6px 8px; }
            .custom-wrap .custom-card .actions { flex-direction: column; gap: 5px; }
            .custom-wrap .custom-card .actions .btn { padding: 6px 0; font-size: 12px; }
            #wandMoving { font-size: 18px; }
        }
    </style>
</head>
<body>

<button class="dark-toggle" id="darkToggle" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>

<div class="container">
    <section id="custom">
        <div class="section-title">
            Package <span class="gold">Customization</span>
            <i class="fas fa-wand-magic-sparkles gold-icon" id="titleWand"></i>
        </div>

        <div class="custom-wrap">
            <div class="custom-card">
                <div class="desc" id="customDesc">Decide your own package, it's all yours. Select services and quantities. <strong>30% OFF for orders RM20+</strong></div>
                <div class="picker" id="customPicker"></div>
                <div class="summary" id="customSummary"><div class="empty">No services selected yet</div></div>
                <div class="actions">
                    <button class="btn btn-secondary" id="clearCustom">Clear All</button>
                    <button class="btn btn-primary" id="addCustomCart">Add to Cart</button>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Wand bergerak - saiz OG 22px -->
<div id="wandMoving"><i class="fas fa-wand-magic-sparkles"></i></div>

<script>
    const servicesData = [
        { id: 's1', label: '1K Instagram Followers', price: 10.00, discount: 0 },
        { id: 's2', label: '1K Instagram Video Views', price: 1.00, discount: 0 },
        { id: 's3', label: '500 Instagram Story Views', price: 3.00, discount: 0 }
    ];

    let customSelections = {};
    let isBeating = false;
    let beatCount = 0;
    let isMoving = false;
    let animFrameId = null;
    let isPaused = false;

    const titleWand = document.getElementById('titleWand');
    const wandMoving = document.getElementById('wandMoving');
    const summaryEl = document.getElementById('customSummary');

    // ===== RENDER =====
    function renderCustomPicker() {
        const container = document.getElementById('customPicker');
        container.innerHTML = servicesData.map((item, index) => {
            const qty = customSelections[item.id] || 0;
            const finalPrice = item.discount ? Math.round(item.price * (1 - item.discount / 100) * 100) / 100 : item.price;
            const hasDiscount = item.discount > 0;
            return `
                <div class="opt" data-id="${item.id}" data-index="${index}" id="opt_${item.id}">
                    <div class="left">
                        <span>${item.label}</span>
                        ${hasDiscount ? `<span class="discount-badge">-${item.discount}%</span>` : ''}
                    </div>
                    <div class="right">
                        ${hasDiscount ? `<span class="original-price">RM${item.price.toFixed(2)}</span>` : ''}
                        <span class="final-price">RM${finalPrice.toFixed(2)}</span>
                        <button class="qty-btn" data-id="${item.id}" data-dir="-1">−</button>
                        <span class="qty-num" id="qtyNum_${item.id}">${qty}</span>
                        <button class="qty-btn plus-btn" data-id="${item.id}" data-dir="1" id="plusBtn_${item.id}">+</button>
                    </div>
                </div>
            `;
        }).join('');

        container.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                const dir = parseInt(this.dataset.dir);
                const current = customSelections[id] || 0;
                const newQty = Math.max(0, current + dir);
                if (newQty === 0) delete customSelections[id];
                else customSelections[id] = newQty;
                renderCustomPicker();
                updateCustomSummary();
            });
        });
    }

    function updateCustomSummary() {
        const entries = Object.entries(customSelections).filter(([_, q]) => q > 0);
        const container = document.getElementById('customSummary');

        if (entries.length === 0) {
            container.innerHTML = '<div class="empty">No services selected yet</div>';
            return;
        }

        let total = 0;
        let html = '';
        entries.forEach(([id, qty]) => {
            const item = servicesData.find(s => s.id === id);
            if (!item) return;
            const price = item.discount ? Math.round(item.price * (1 - item.discount / 100) * 100) / 100 : item.price;
            const subtotal = price * qty;
            total += subtotal;
            html += `<div class="item"><span>${item.label} x${qty}</span><span>RM${subtotal.toFixed(2)}</span></div>`;
        });

        let discount = 0;
        const minPurchase = 20;
        const discountPercent = 30;
        if (total >= minPurchase && discountPercent > 0) {
            discount = Math.round(total * (discountPercent / 100) * 100) / 100;
        }
        const finalTotal = total - discount;

        html += `<div class="total-row"><span>Subtotal</span><span>RM${total.toFixed(2)}</span></div>`;
        if (discount > 0) {
            html += `<div class="total-row discount"><span>Discount ${discountPercent}%</span><span>-RM${discount.toFixed(2)}</span></div>`;
        }
        html += `<div class="total-row"><span>Total</span><span>RM${finalTotal.toFixed(2)}</span></div>`;
        container.innerHTML = html;
    }

    // ===== GET POSITION - CENTER TEPAT =====
    function getPlusButtonPosition() {
        const btn = document.querySelector('#opt_s1 .plus-btn');
        if (!btn) return null;
        const rect = btn.getBoundingClientRect();
        // Center of button - 11px because font-size 22px / 2
        return { x: rect.left + rect.width / 2 - 11, y: rect.top + rect.height / 2 - 11 };
    }

    function getTitlePosition() {
        const rect = titleWand.getBoundingClientRect();
        return { x: rect.left + rect.width / 2 - 11, y: rect.top + rect.height / 2 - 11 };
    }

    // ===== SPARKLES =====
    function createSparklesAtElement(el, count = 8) {
        const rect = el.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        for (let i = 0; i < count; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle-particle';
            const symbols = ['✦', '✧', '✦', '✧', '✦', '✧', '✦', '✧'];
            sparkle.textContent = symbols[i % symbols.length];
            const angle = (i / count) * Math.PI * 2 + Math.random() * 0.2;
            const distance = 20 + Math.random() * 35;
            sparkle.style.left = (x + (Math.random() - 0.5) * 6) + 'px';
            sparkle.style.top = (y + (Math.random() - 0.5) * 6) + 'px';
            sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
            sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
            sparkle.style.fontSize = (8 + Math.random() * 10) + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => { if (sparkle.parentNode) sparkle.remove(); }, 600);
        }
    }

    // ===== ADD TO PACKAGE =====
    function addToPackage(serviceId) {
        const current = customSelections[serviceId] || 0;
        customSelections[serviceId] = current + 1;
        renderCustomPicker();
        updateCustomSummary();

        // Heartbeat effect - hanya bila sampai drop
        wandMoving.classList.remove('beating');
        void wandMoving.offsetWidth;
        wandMoving.classList.add('beating');

        const qtyEl = document.getElementById('qtyNum_' + serviceId);
        if (qtyEl) {
            qtyEl.classList.remove('bounce-num');
            void qtyEl.offsetWidth;
            qtyEl.classList.add('bounce-num');
        }

        const btn = document.querySelector(`.plus-btn[data-id="${serviceId}"]`);
        if (btn) {
            btn.classList.remove('pulse-glow');
            void btn.offsetWidth;
            btn.classList.add('pulse-glow');
            setTimeout(() => btn.classList.remove('pulse-glow'), 400);
            createSparklesAtElement(btn, 6);
        }

        // Update wand position to stay centered
        const pos = getPlusButtonPosition();
        if (pos) {
            wandMoving.style.left = pos.x + 'px';
            wandMoving.style.top = pos.y + 'px';
        }
    }

    // ===== SLIDE WAND - SMOOTH, SAIZ OG =====
    function slideWandToButton() {
        if (isMoving) return;
        isMoving = true;

        const startPos = getTitlePosition();
        const endPos = getPlusButtonPosition();

        if (!startPos || !endPos) {
            isMoving = false;
            return;
        }

        // Hide title wand
        titleWand.style.display = 'none';

        // Show moving wand at start position - saiz OG 22px
        wandMoving.style.display = 'block';
        wandMoving.style.fontSize = '22px';
        wandMoving.style.left = startPos.x + 'px';
        wandMoving.style.top = startPos.y + 'px';
        wandMoving.style.opacity = '1';

        const startTime = performance.now();
        const duration = 800;

        function animateMove(time) {
            const elapsed = time - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Ease in-out cubic
            const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

            const x = startPos.x + (endPos.x - startPos.x) * ease;
            const y = startPos.y + (endPos.y - startPos.y) * ease;

            wandMoving.style.left = x + 'px';
            wandMoving.style.top = y + 'px';

            if (progress < 1) {
                animFrameId = requestAnimationFrame(animateMove);
            } else {
                wandMoving.style.left = endPos.x + 'px';
                wandMoving.style.top = endPos.y + 'px';
                isMoving = false;
                animFrameId = null;

                // Start heartbeat after 1 second
                setTimeout(() => {
                    startAutoBeat();
                }, 800);
            }
        }

        animFrameId = requestAnimationFrame(animateMove);
    }

    // ===== AUTO BEAT 5 KALI, ZOOM SUMMARY =====
    function startAutoBeat() {
        if (isBeating) return;
        isBeating = true;
        beatCount = 0;

        // Reset s1 quantity
        customSelections['s1'] = 0;
        renderCustomPicker();
        updateCustomSummary();

        // Update wand position
        const pos = getPlusButtonPosition();
        if (pos) {
            wandMoving.style.left = pos.x + 'px';
            wandMoving.style.top = pos.y + 'px';
        }

        function doBeat() {
            beatCount++;
            addToPackage('s1');

            // Update wand position
            const p = getPlusButtonPosition();
            if (p) {
                wandMoving.style.left = p.x + 'px';
                wandMoving.style.top = p.y + 'px';
            }

            if (beatCount < 5) {
                setTimeout(doBeat, 650);
            } else {
                isBeating = false;

                // ZOOM SUMMARY - tunjuk diskaun gila
                setTimeout(() => {
                    summaryEl.classList.remove('zoom');
                    void summaryEl.offsetWidth;
                    summaryEl.classList.add('zoom');

                    // Keep zoomed for content recording
                    setTimeout(() => {
                        // Stay zoomed - untuk content
                        console.log('✅ Zoom complete - content ready');
                    }, 2000);

                }, 500);
            }
        }

        setTimeout(doBeat, 600);
    }

    // ===== CLEAR =====
    document.getElementById('clearCustom').addEventListener('click', function() {
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
        isMoving = false;
        isBeating = false;

        customSelections = {};
        renderCustomPicker();
        updateCustomSummary();

        wandMoving.style.display = 'none';
        titleWand.style.display = 'inline-block';
        titleWand.style.position = 'relative';
        titleWand.style.zIndex = 'auto';
        titleWand.style.fontSize = '22px';
        summaryEl.classList.remove('zoom');

        setTimeout(() => {
            slideWandToButton();
        }, 1000);
    });

    // ===== ADD TO CART =====
    document.getElementById('addCustomCart').addEventListener('click', function() {
        const entries = Object.entries(customSelections).filter(([_, q]) => q > 0);
        if (entries.length === 0) {
            alert('No services selected');
            return;
        }
        alert('Package added to cart! 🎉');
    });

    // ===== DARK MODE =====
    document.getElementById('darkToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        const icon = this.querySelector('i');
        if (document.body.classList.contains('dark-mode')) {
            icon.className = 'fas fa-sun';
        } else {
            icon.className = 'fas fa-moon';
        }
    });

    // ===== INIT =====
    renderCustomPicker();
    updateCustomSummary();

    setTimeout(() => {
        slideWandToButton();
    }, 1000);

    console.log('✅ Wand saiz OG 22px - tiada effect masa drag');
    console.log('✅ Heartbeat hanya bila sampai drop');
    console.log('✅ Center tepat dengan button +');
    console.log('✅ Zoom summary lepas 5 kali - tunjuk diskaun');
</script>

</body>
</html>
